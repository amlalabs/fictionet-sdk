<div style="overflow-x:auto;margin:1.25em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" role="img" aria-labelledby="fn-running-t fn-running-d" style="display:block;width:100%;max-width:720px;min-width:480px;height:auto">
<title id="fn-running-t">The four calls of a world program</title>
<desc id="fn-running-d">Inside the world process, main makes four calls in order. 1: attachments() makes a channel with two halves, the Attacher and the Attachments. 2: listen(socket, attacher), given a WorldSocket such as WorldSocket::UnixSocket(path), returns immediately and starts a helper thread. 3: run(|fcx| world(fcx, attachments)) makes one future. Nothing runs yet. 4: block_on polls that future on main's thread, which runs world(fcx, attachments) as the first task. Outside the process, each fictionet attach connects to world.sock. The helper thread reads its hello, answers accept or refuse, and puts the accepted sandbox into the channel. The world takes it from the Attachments as an Attachment named agent.</desc>
<defs><marker id="fn-running-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.25">
<rect x="10" y="98" width="580" height="302" rx="10" stroke-dasharray="2 4"/>
<rect x="330" y="18" width="240" height="54" rx="6" stroke-dasharray="5 4"/>
<rect x="40" y="128" width="230" height="46" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="40" y="198" width="230" height="46" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="40" y="268" width="230" height="46" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="40" y="338" width="230" height="46" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="330" y="188" width="240" height="66" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="330" y="318" width="240" height="66" rx="6" fill="currentColor" fill-opacity="0.06"/>
<path d="M155,176 V196" marker-end="url(#fn-running-a)"/>
<path d="M155,246 V266" marker-end="url(#fn-running-a)"/>
<path d="M155,316 V336" marker-end="url(#fn-running-a)"/>
<path d="M272,221 H328" marker-end="url(#fn-running-a)"/>
<path d="M272,361 H328" marker-end="url(#fn-running-a)"/>
<path d="M450,74 V186" stroke-width="1.75" marker-start="url(#fn-running-a)" marker-end="url(#fn-running-a)"/>
<path d="M450,256 V316" marker-end="url(#fn-running-a)"/>
</g>
<g fill="currentColor" font-family="'Fira Sans',Arial,sans-serif" font-size="13">
<text x="450" y="40" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">fictionet attach --name agent</text>
<text x="450" y="58" text-anchor="middle" font-size="11.5">one per sandbox, outside the world</text>
<text x="22" y="117" font-size="12">the world process</text>
<text x="458" y="132" font-family="'Source Code Pro',monospace" font-size="11.5">world.sock</text>
<text x="458" y="148" font-size="11.5">hello, then accept</text>
<text x="458" y="163" font-size="11.5">or refuse</text>
<text x="24" y="156" font-size="12">1</text>
<text x="24" y="226" font-size="12">2</text>
<text x="24" y="296" font-size="12">3</text>
<text x="24" y="366" font-size="12">4</text>
<text x="155" y="148" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">attachments()</text>
<text x="155" y="165" text-anchor="middle" font-size="11.5">Attacher + Attachments</text>
<text x="155" y="218" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">listen(socket, attacher)</text>
<text x="155" y="235" text-anchor="middle" font-size="11.5">returns immediately</text>
<text x="155" y="288" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">run(|fcx| world(fcx, ..))</text>
<text x="155" y="305" text-anchor="middle" font-size="11.5">one future, not yet polled</text>
<text x="155" y="358" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">block_on(future)</text>
<text x="155" y="375" text-anchor="middle" font-size="11.5">polls it on main’s thread</text>
<text x="300" y="213" text-anchor="middle" font-size="11">starts</text>
<text x="300" y="353" text-anchor="middle" font-size="11">runs</text>
<text x="450" y="210" text-anchor="middle">the helper thread</text>
<text x="450" y="227" text-anchor="middle" font-size="11.5">accepts each attach, and puts</text>
<text x="450" y="243" text-anchor="middle" font-size="11.5">the sandbox into the channel</text>
<text x="458" y="282" font-size="11.5">through the</text>
<text x="458" y="297" font-size="11.5">Attacher</text>
<text x="450" y="340" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">world(fcx, attachments)</text>
<text x="450" y="358" text-anchor="middle" font-size="11.5">the first task of the run:</text>
<text x="450" y="374" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="11">attachments.get(&amp;fcx, "agent")</text>
</g>
