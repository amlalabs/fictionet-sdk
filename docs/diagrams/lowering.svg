<path d="M160,190 H188" stroke-dasharray="6 4" marker-start="url(#fn-low-a)" marker-end="url(#fn-low-a)"/>
<path d="M160,286 H188" stroke-dasharray="6 4" marker-start="url(#fn-low-a)" marker-end="url(#fn-low-a)"/>
