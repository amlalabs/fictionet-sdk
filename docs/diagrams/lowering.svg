<div style="overflow-x:auto;margin:1.25em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" role="img" aria-labelledby="fn-low-t fn-low-d" style="display:block;width:100%;max-width:816px;min-width:480px;height:auto">
<title id="fn-low-t">How each attach type becomes IP packets</title>
<desc id="fn-low-d">Four rows, one per attach type, read left to right: what the sandbox sends, what reaches fictionet attach, how attach turns it into IP packets, the world socket, and the world's Attachment. tun: the sandbox kernel's IP stack sends IP packets through tun0; attach reads them from the tun file descriptor and relays each one unchanged. tap: a VM's kernel sends Ethernet frames through its card; they reach attach over QEMU's stream socket, or through a TAP device and a traffic-control redirect; attach strips the Ethernet header and answers ARP, neighbor discovery, DHCP and router solicitations itself. https_proxy and socks5: a program such as curl sends a CONNECT request and then bytes over a TCP connection to attach; attach's own TCP/IP stack, the stdlib's, at the sandbox's address, sends a DNS query to the world's DNS server and opens one TCP connection into the world for each request. Every IP packet then crosses the world socket as one packet message, and the world's Attachment receives IP packets, whatever the type.</desc>
<defs><marker id="fn-low-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
