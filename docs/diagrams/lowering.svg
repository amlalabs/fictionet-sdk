<path d="M326,286 H344" stroke-dasharray="6 4" marker-start="url(#fn-low-a)" marker-end="url(#fn-low-a)"/>
<path d="M326,382 H344" stroke-dasharray="6 4" marker-start="url(#fn-low-a)" marker-end="url(#fn-low-a)"/>
