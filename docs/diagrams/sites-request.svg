<text x="580" y="117">first lookup: the callback runs,</text>
<text x="580" y="132">the site gets an address and</text>
<text x="580" y="147">a machine</text>
<text x="596" y="166" font-family="'Source Code Pro',monospace" font-size="12">Event::Dns</text>
<text x="580" y="193">the filter checks the source,</text>
<text x="580" y="208">the router takes the /32 route</text>
<text x="580" y="232">handshake: 10 s from connecting</text>
<text x="580" y="252">a TLS site with this name here?</text>
<text x="580" y="267">No: unrecognized_name. Yes: its</text>
<text x="580" y="282">config, ALPN h2 and http/1.1</text>
<text x="596" y="298" font-family="'Source Code Pro',monospace" font-size="12">Event::Tls</text>
<text x="580" y="331">routed by :authority or Host</text>
<text x="580" y="363">Target: https, the host,</text>
<text x="580" y="378">port 443 and the SNI</text>
<text x="596" y="436" font-family="'Source Code Pro',monospace" font-size="12">Event::Http</text>
<text x="580" y="452">when the body ends</text>
