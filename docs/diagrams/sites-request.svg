<div style="overflow-x:auto;margin:1.25em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="fn-req-t fn-req-d" style="display:block;width:100%;max-width:836px;min-width:680px;height:auto">
<title id="fn-req-t">One HTTPS request through Sites</title>
<desc id="fn-req-d">The sandbox asks the gateway at 10.0.0.1 port 53 for the A record of api.stripe.com. On this first lookup the callback runs and the site gets an address, here 198.18.0.1, and a machine. The gateway answers with the address, TTL 60, and makes an Event::Dns. The sandbox connects to 198.18.0.1 port 443. Its filter checks the source address, and the router takes the packet to the machine's /32 route. The client hello names api.stripe.com. If a TLS site with that name is at this address, the handshake finishes with the config from the site's tls callback and ALPN h2 and http/1.1. Otherwise it is rejected with unrecognized_name. The machine makes an Event::Tls when the handshake ends. The request is routed by its host to the site's handler, with a Target in its extensions. The response goes back to the sandbox, and an Event::Http is made when the body ends.</desc>
