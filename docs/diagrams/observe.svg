<g fill="currentColor" font-family="'Fira Sans',Arial,sans-serif" font-size="12" text-anchor="middle">
<text x="106" y="14" font-size="12.5">the world process</text>
<text x="106" y="72" font-family="'Source Code Pro',monospace" font-size="13.5">run</text>
<text x="106" y="92">tasks, links, counts</text>
<text x="106" y="108">and events, kept as</text>
<text x="106" y="124">the world runs</text>
<text x="146" y="160" font-size="11">attachments</text>
<text x="106" y="202" font-family="'Source Code Pro',monospace" font-size="13.5">listen</text>
<text x="106" y="222">the world socket,</text>
<text x="106" y="238">/run/fictionet/</text>
<text x="106" y="254">world.sock</text>
<text x="272" y="114" font-size="11">one Unix socket,</text>
<text x="272" y="128" font-size="11">many connections</text>
<text x="427" y="64" font-family="'Source Code Pro',monospace" font-size="13">fictionet attach</text>
<text x="427" y="82" font-size="11">hello type tun: packets</text>
<text x="427" y="150" font-family="'Source Code Pro',monospace" font-size="13">fictionet dashboard</text>
<text x="427" y="168" font-size="11">hello type observe</text>
<text x="427" y="236" font-family="'Source Code Pro',monospace" font-size="13">fictionet observe</text>
<text x="427" y="254" font-size="11">hello type observe</text>
<text x="626" y="64">the sandbox</text>
<text x="626" y="82" font-size="11">its tun0 device</text>
<text x="626" y="150">a browser</text>
<text x="626" y="168" font-size="11">127.0.0.1:7878</text>
