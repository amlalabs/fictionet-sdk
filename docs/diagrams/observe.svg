<div style="overflow-x:auto;margin:1.25em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="fn-observe-t fn-observe-d" style="display:block;width:100%;max-width:840px;min-width:560px;height:auto">
<title id="fn-observe-t">Who connects to the world socket</title>
<desc id="fn-observe-d">The world process runs the world, which keeps track of its tasks, links, packet counts and events, and listens on the world socket. Three kinds of client connect to that one Unix socket. fictionet attach sends a hello of a sandbox type such as tun and then relays the sandbox's packets. fictionet dashboard sends a hello of type observe, then requests and replies; it serves the dashboard to a browser over HTTP on 127.0.0.1. fictionet observe also sends a hello of type observe, and prints the replies as JSON lines for scripts.</desc>
<defs><marker id="fn-observe-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.25">
