<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="fn-observe-t fn-observe-d">
<style>svg:root{color:#1f2328}@media (prefers-color-scheme:dark){svg:root{color:#e6edf3}}</style>
<title id="fn-observe-t">Attachment and observation sockets</title>
<desc id="fn-observe-d">Inside the world process, the run produces events, topology, packets and TLS keys. The DashboardObserver's collector retains them and copies packet bytes. Listen sends attachments from /run/fictionet/world.sock to the run. The run sends observations to DashboardObserver, which gives its handle to serve. Serve exposes the handle on /run/fictionet/observe.sock. Two curves connect serve to the observation clients. Fictionet attach uses the world socket with hello type tun and relays packets. Fictionet dashboard and fictionet observe use the observation socket with hello fictionet-observe version 2. The dashboard serves a browser at 127.0.0.1:7878. The observe command writes JSON lines to a shell.</desc>
