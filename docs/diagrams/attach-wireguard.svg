<div style="overflow-x:auto;margin:1.25em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="fn-wg-t fn-wg-d" style="display:block;width:100%;max-width:720px;min-width:480px;height:auto">
<title id="fn-wg-t">A remote sandbox attached with WireGuard (not built yet)</title>
<desc id="fn-wg-d">The plan for --type wireguard, which is not built yet. The sandbox runs on a provider's machine, such as E2B or Modal. On a machine you control, fictionet attach --type wireguard --listen 0.0.0.0:51820 makes a WireGuard config, fictionet.conf, with the sandbox's address and DNS server, and the harness copies it into the sandbox. In the sandbox, wg-quick up makes the WireGuard interface fictionet from it, sets the address from the Address line, and has resolvconf write resolv.conf from the DNS line. The agent's programs send IP packets through that interface, over UDP port 51820 across the internet, to attach, which relays them to the world process next to it.</desc>
