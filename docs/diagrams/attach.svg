<path d="M390,172 V474" stroke-width="1.75" marker-start="url(#fn-attach-a)" marker-end="url(#fn-attach-a)"/>
<path d="M390,365 H302" marker-end="url(#fn-attach-a)"/>
<path d="M165,396 V422" marker-end="url(#fn-attach-a)"/>
<path d="M165,470 V490" marker-end="url(#fn-attach-a)"/>
<path d="M300,511 H328" marker-end="url(#fn-attach-a)"/>
</g>
<g fill="currentColor" font-family="'Fira Sans',Arial,sans-serif" font-size="13">
<text x="22" y="29" font-size="12">the sandbox’s network namespace</text>
<text x="130" y="65" text-anchor="middle">the agent’s programs</text>
<text x="420" y="65" text-anchor="middle">TUN device</text>
<text x="275" y="53" text-anchor="middle" font-size="11.5">IP packets</text>
<text x="420" y="140" text-anchor="middle">fictionet attach</text>
<text x="420" y="158" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="11.5">--name agent --type tun</text>
<text x="300" y="136" text-anchor="end" font-size="12">one per sandbox, wherever it</text>
<text x="300" y="152" text-anchor="end" font-size="12">can get the sandbox’s packets</text>
<text x="380" y="214" text-anchor="end" font-size="12">a Unix SOCK_SEQPACKET</text>
<text x="380" y="230" text-anchor="end" font-size="12">socket, such as world.sock.</text>
<text x="380" y="246" text-anchor="end" font-size="12">One message per datagram.</text>
<text x="22" y="320" font-size="12">the world process</text>
<text x="165" y="354" text-anchor="middle"><tspan font-family="'Source Code Pro',monospace" font-size="12.5">listen</tspan>: one helper thread</text>
<text x="165" y="371" text-anchor="middle" font-size="11.5">accepts, reads the hello,</text>
<text x="165" y="387" text-anchor="middle" font-size="11.5">answers accept or refuse</text>
<text x="346" y="358" text-anchor="middle" font-size="11.5">handshake</text>
<text x="165" y="444" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12.5">Attacher → Attachments</text>
<text x="165" y="461" text-anchor="middle" font-size="11.5">a channel, in arrival order</text>
<text x="165" y="516" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">attachments.get(&amp;cx, "agent")</text>
<text x="400" y="408" font-size="11.5">read, and written at</text>
<text x="400" y="423" font-size="11.5">once, on the world’s</text>
<text x="400" y="438" font-size="11.5">thread. Packets that wait</text>
<text x="400" y="453" font-size="11.5">for room: the helper</text>
<text x="400" y="468" font-size="11.5">thread of listen.</text>
<text x="440" y="499" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12.5">Attachment “agent”</text>
<text x="440" y="518" text-anchor="middle" font-size="11.5">an Interface</text>
</g>
