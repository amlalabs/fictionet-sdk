<div style="overflow-x:auto;margin:1.25em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" role="img" aria-labelledby="fn-attach-t fn-attach-d" style="display:block;width:100%;max-width:696px;min-width:480px;height:auto">
<title id="fn-attach-t">How a sandbox reaches a world</title>
<desc id="fn-attach-d">Inside the sandbox's network namespace, the agent's programs send IP packets through a TUN device. fictionet attach, one per sandbox, holds the TUN device and relays its packets to the world. The relay runs over a Unix SOCK_SEQPACKET socket, one message per datagram. In the world process, listen runs a helper thread that accepts the connection, reads the hello and answers accept or refuse. It hands the sandbox to the Attacher, which puts it in the Attachments channel. The world takes it with attachments.get, by name, and gets an Attachment, an Interface. The world's own thread reads packets straight from the socket, and writes each one at once when the socket has room. A packet that must wait for room goes into a queue, and the helper thread of listen writes the queue out.</desc>
<defs><marker id="fn-attach-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.25">
<rect x="10" y="10" width="560" height="84" rx="10" stroke-dasharray="2 4"/>
<rect x="10" y="300" width="560" height="250" rx="10" stroke-dasharray="2 4"/>
<rect x="30" y="40" width="200" height="40" rx="6" stroke-dasharray="5 4"/>
<rect x="320" y="40" width="200" height="40" rx="6" stroke-dasharray="5 4"/>
<rect x="320" y="118" width="200" height="52" rx="6" stroke-dasharray="5 4"/>
<rect x="30" y="334" width="270" height="62" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="30" y="424" width="270" height="46" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="30" y="492" width="270" height="38" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="330" y="476" width="220" height="56" rx="6" fill="currentColor" fill-opacity="0.06"/>
