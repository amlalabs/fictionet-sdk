<div style="overflow-x:auto;margin:1.25em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="fn-proxy-t fn-proxy-d" style="display:block;width:100%;max-width:768px;min-width:480px;height:auto">
<title id="fn-proxy-t">An agent behind a proxy, attached with http_proxy</title>
<desc id="fn-proxy-d">fictionet attach --type http_proxy (socks5 is the same with ALL_PROXY). In the sandbox, curl runs with HTTPS_PROXY=http://fictionet:TOKEN@attach:8080. The sandbox gets no new interface and no privileges, and its resolv.conf is not used for these requests. curl opens a TCP connection to fictionet attach --type http_proxy --listen 0.0.0.0:8080, gives the token, and asks for en.wikipedia.org:443. Attach plays the sandbox's kernel: it sends a DNS query to the --dns server inside the world, then opens a TCP connection from the --ip-addr address, 10.0.0.2, to the address it got. The world process sees IP packets, the same as from a tun sandbox. The platform blocks every other way out of the sandbox.</desc>
<defs><marker id="fn-proxy-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.25">
<rect x="10" y="10" width="240" height="172" rx="10" stroke-dasharray="2 4"/>
<rect x="30" y="44" width="200" height="62" rx="6" stroke-dasharray="5 4"/>
<rect x="390" y="34" width="240" height="84" rx="6" stroke-dasharray="5 4"/>
<rect x="390" y="196" width="240" height="60" rx="6" fill="currentColor" fill-opacity="0.06"/>
<path d="M232,75 H388" stroke-width="1.75" stroke-dasharray="6 4" marker-start="url(#fn-proxy-a)" marker-end="url(#fn-proxy-a)"/>
<path d="M510,120 V194" stroke-width="1.75" stroke-dasharray="6 4" marker-start="url(#fn-proxy-a)" marker-end="url(#fn-proxy-a)"/>
</g>
<g fill="currentColor" font-family="'Fira Sans',Arial,sans-serif" font-size="13">
<text x="22" y="29" font-size="12">the sandbox</text>
<text x="130" y="66" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">curl</text>
<text x="130" y="83" text-anchor="middle" font-size="11.5">with HTTPS_PROXY=</text>
<text x="130" y="98" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="9">http://fictionet:TOKEN@attach:8080</text>
<text x="30" y="134" font-size="11.5">no new interface, no privileges,</text>
<text x="30" y="150" font-size="11.5">no resolv.conf for these names;</text>
<text x="30" y="166" font-size="11.5">every other way out blocked</text>
<text x="320" y="66" text-anchor="middle" font-size="11.5">TCP to :8080,</text>
<text x="320" y="96" text-anchor="middle" font-size="11.5">asking for</text>
<text x="320" y="111" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="10.5">en.wikipedia.org:443</text>
<text x="510" y="56" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">fictionet attach</text>
<text x="510" y="73" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="11">--type http_proxy</text>
<text x="510" y="89" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="11">--listen 0.0.0.0:8080</text>
<text x="510" y="107" text-anchor="middle" font-size="11.5">plays the sandbox’s kernel</text>
<text x="500" y="142" text-anchor="end" font-size="11.5">IP packets: a DNS query to --dns,</text>
<text x="500" y="158" text-anchor="end" font-size="11.5">then TCP from 10.0.0.2 (--ip-addr)</text>
<text x="510" y="220" text-anchor="middle">the world process</text>
<text x="510" y="238" text-anchor="middle" font-size="11.5">gets IP packets, as from tun</text>
</g>
</svg>
</div>
