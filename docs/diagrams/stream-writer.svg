<div style="overflow-x:auto;margin:1.25em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="fn-writer-t fn-writer-d" style="display:block;width:100%;max-width:720px;min-width:480px;height:auto">
<title id="fn-writer-t">Writing packets to a stream (not built yet)</title>
<desc id="fn-writer-d">Top: the writer at one end of a remote connection. New packets go into a short queue of whole packets. When the queue is full, a new packet is dropped whole. From the queue, packets go into the TCP stream, each as a length and then the message. A message that went out in part, with its first part already in the stream, is finished first. Each length counts its whole message: the kind byte, 04, then the packet. So a 1,500-byte packet is a 1,501-byte message, and a 60-byte packet a 61-byte message. Middle: what goes wrong if the writer dropped the rest of a half-sent 1,501-byte message. The stream then holds a length of 1,501, only 750 bytes, then the next length and message. The receiver takes the next 1,501 bytes as the message, which runs into the following messages. Then it reads bytes from the middle of a packet as a length. Every later message is misread. Bottom: when the writer finishes the half-sent message, every length is followed by exactly that many bytes, and each message is read correctly.</desc>
<defs><marker id="fn-writer-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
