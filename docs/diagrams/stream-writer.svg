<g fill="currentColor" font-family="'Fira Sans',Arial,sans-serif" font-size="13">
<text x="10" y="22" font-size="12">The writer, at either end of a remote connection</text>
<text x="590" y="22" text-anchor="end" font-size="11.5" font-style="italic">not built yet</text>
<text x="20" y="52" font-size="11.5">new</text>
<text x="168" y="48" text-anchor="middle" font-size="11.5">a short queue</text>
<text x="168" y="102" text-anchor="middle" font-size="11.5">of whole packets</text>
<text x="88" y="132" font-size="11.5">queue full: the new packet is dropped, whole</text>
<text x="460" y="44" text-anchor="middle" font-size="11.5">the TCP stream</text>
<text x="307" y="75" text-anchor="middle" font-size="11">the rest</text>
<text x="380" y="75" text-anchor="middle" font-size="11">sent</text>
<text x="458" y="75" text-anchor="middle" font-size="11">earlier</text>
<text x="535" y="75" text-anchor="middle" font-size="11">earlier</text>
<text x="350" y="108" text-anchor="middle" font-size="11.5">a half-sent message is finished first</text>
<text x="10" y="180" font-size="12">If the writer dropped the rest of a half-sent message, a 1,500-byte packet:</text>
<text x="45" y="213" text-anchor="middle" font-size="10.5">1501</text>
<text x="110" y="213" text-anchor="middle" font-size="11">750 bytes</text>
<text x="175" y="213" text-anchor="middle" font-size="10.5">61</text>
<text x="215" y="213" text-anchor="middle" font-size="11">61 bytes</text>
<text x="255" y="213" text-anchor="middle" font-size="10.5">1501</text>
<text x="370" y="213" text-anchor="middle" font-size="11">the next message</text>
<text x="160" y="250" text-anchor="middle" font-size="11.5">taken as the 1,501 bytes</text>
<text x="300" y="246" font-size="11.5">then read as a length: bytes from</text>
<text x="300" y="262" font-size="11.5">two places. Every later message is misread.</text>
<text x="10" y="300" font-size="12">What the writer does: it finishes the message, so each length is right.</text>
<text x="45" y="333" text-anchor="middle" font-size="10.5">1501</text>
<text x="160" y="333" text-anchor="middle" font-size="11">1,501 bytes</text>
<text x="275" y="333" text-anchor="middle" font-size="10.5">61</text>
<text x="315" y="333" text-anchor="middle" font-size="11">61 bytes</text>
<text x="355" y="333" text-anchor="middle" font-size="10.5">1501</text>
<text x="470" y="333" text-anchor="middle" font-size="11">the next message</text>
<text x="160" y="372" text-anchor="middle" font-size="11.5">message 1</text>
<text x="315" y="372" text-anchor="middle" font-size="11.5">message 2</text>
<text x="470" y="372" text-anchor="middle" font-size="11.5">message 3</text>
<text x="10" y="396" font-size="11">Each length counts its whole message: the kind byte, 04, then the packet.</text>
<text x="10" y="412" font-size="11">Lengths are 4 bytes. Widths are not to scale.</text>
</g>
