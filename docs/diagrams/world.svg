<div style="overflow-x:auto;margin:1.25em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-labelledby="fn-world-t fn-world-d" style="display:block;width:100%;max-width:528px;min-width:340px;height:auto">
<title id="fn-world-t">The world above, as tasks and interfaces</title>
<desc id="fn-world-d">The sandbox agent, outside the world process, reaches the world as the Attachment agent. That attachment is the interface the delay task reads. The delay task returns a new interface, link, which goes into split_versions. split_versions returns three ends: v4 and v6, which the example routes next with route::router, and other, which it drops, so that interface closes. Every task runs inside the one future that run returns, polled on one thread.</desc>
<g fill="none" stroke="currentColor" stroke-width="1.25">
<rect x="10" y="72" width="420" height="360" rx="10" stroke-dasharray="2 4"/>
<rect x="75" y="10" width="190" height="44" rx="6" stroke-dasharray="5 4"/>
<rect x="95" y="132" width="150" height="46" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="80" y="238" width="180" height="46" rx="6" fill="currentColor" fill-opacity="0.06"/>
<rect x="80" y="352" width="160" height="46" rx="6" stroke-dasharray="5 4"/>
<g stroke-width="1.75">
<path d="M170,54 V132"/>
<path d="M170,178 V238"/>
<path d="M125,284 V352"/>
<path d="M175,284 V352"/>
<path d="M225,284 L283,320"/>
</g>
<path d="M280,316 l8,8 m0,-8 l-8,8" stroke-width="1.5"/>
<rect x="290" y="132" width="34" height="22" rx="4" fill="currentColor" fill-opacity="0.06"/>
<path d="M294,190 H322" stroke-width="1.75"/>
</g>
<g fill="currentColor">
<circle cx="170" cy="132" r="3.5"/>
<circle cx="170" cy="178" r="3.5"/>
<circle cx="170" cy="238" r="3.5"/>
<circle cx="125" cy="284" r="3.5"/>
<circle cx="175" cy="284" r="3.5"/>
<circle cx="225" cy="284" r="3.5"/>
<circle cx="125" cy="352" r="3.5"/>
<circle cx="175" cy="352" r="3.5"/>
<circle cx="294" cy="190" r="3.5"/>
<circle cx="322" cy="190" r="3.5"/>
</g>
<g fill="currentColor" font-family="'Fira Sans',Arial,sans-serif" font-size="13">
<text x="170" y="30" text-anchor="middle">sandbox “agent”</text>
<text x="170" y="46" text-anchor="middle" font-size="11.5">reached through fictionet attach</text>
<text x="22" y="422" font-size="12">run(seed, world): one future, polled on one thread</text>
<text x="178" y="108" font-family="'Source Code Pro',monospace" font-size="12.5">Attachment “agent”</text>
<text x="170" y="153" text-anchor="middle" font-family="'Source Code Pro',monospace">delay</text>
<text x="170" y="170" text-anchor="middle" font-size="11.5">50 ms each way</text>
<text x="178" y="214" font-family="'Source Code Pro',monospace" font-size="12.5">link</text>
<text x="170" y="259" text-anchor="middle" font-family="'Source Code Pro',monospace">split_versions</text>
<text x="170" y="276" text-anchor="middle" font-size="11.5">sorts by IP version</text>
<text x="119" y="324" text-anchor="end" font-family="'Source Code Pro',monospace" font-size="12.5">v4</text>
<text x="181" y="324" font-family="'Source Code Pro',monospace" font-size="12.5">v6</text>
<text x="294" y="318" font-size="12">other: dropped as _,</text>
<text x="294" y="334" font-size="12">so that interface closes</text>
<text x="160" y="373" text-anchor="middle" font-family="'Source Code Pro',monospace">route::router</text>
<text x="160" y="390" text-anchor="middle" font-size="11.5">the example’s next step</text>
<text x="332" y="148" font-size="12">a task</text>
<text x="332" y="194" font-size="12">an interface pair</text>
<text x="292" y="214" font-size="11.5">from pair(). Each dot</text>
<text x="292" y="229" font-size="11.5">is one End</text>
</g>
