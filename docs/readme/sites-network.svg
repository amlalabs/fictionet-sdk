<g fill="currentColor" font-family="'Fira Sans',Arial,sans-serif" font-size="13">
<text x="110" y="39" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12.5">Attachment “a”</text>
<text x="290" y="39" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12.5">Attachment “b”</text>
<text x="430" y="39" text-anchor="middle">…</text>
<text x="110" y="115" text-anchor="middle">filter</text>
<text x="110" y="132" text-anchor="middle" font-size="11.5">one task per sandbox</text>
<text x="290" y="115" text-anchor="middle">filter</text>
<text x="290" y="132" text-anchor="middle" font-size="11.5">one task per sandbox</text>
<text x="430" y="122" text-anchor="middle">…</text>
<text x="118" y="176" font-family="'Source Code Pro',monospace" font-size="11.5">10.0.0.2/32</text>
<text x="298" y="176" font-family="'Source Code Pro',monospace" font-size="11.5">10.0.0.3/32</text>
<text x="285" y="220" text-anchor="middle" font-family="'Source Code Pro',monospace">route::router</text>
<text x="285" y="236" text-anchor="middle" font-size="11.5">one task. The longest prefix wins.</text>
<text x="105" y="320" text-anchor="middle" font-weight="500">gateway</text>
<text x="105" y="338" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">10.0.0.1, 2001:db8::1</text>
<text x="105" y="367" text-anchor="middle" font-size="12">UDP 53: DNS</text>
<text x="105" y="397" text-anchor="middle" font-size="12">TCP 53: DNS</text>
<text x="105" y="427" text-anchor="middle" font-size="12">ICMP: answers pings</text>
<text x="305" y="320" text-anchor="middle" font-weight="500">a machine per address</text>
<text x="305" y="338" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">198.18.0.1, 2001:2::1, …</text>
<text x="305" y="367" text-anchor="middle" font-size="12">TCP 80: HTTP</text>
<text x="305" y="397" text-anchor="middle" font-size="12">TCP 443: TLS, then HTTP</text>
<text x="305" y="427" text-anchor="middle" font-size="12">UDP: port unreachable</text>
<text x="305" y="457" text-anchor="middle" font-size="12">ICMP: answers pings</text>
<text x="485" y="320" text-anchor="middle" font-family="'Source Code Pro',monospace" font-size="12">0.0.0.0/0, ::/0</text>
<text x="485" y="340" text-anchor="middle" font-size="11.5">every other address:</text>
<text x="485" y="357" text-anchor="middle" font-size="11.5">ICMP(v6) unreachable,</text>
<text x="485" y="374" text-anchor="middle" font-size="11.5">from the gateway</text>
<g font-size="11.5">
<text x="562" y="30">every sandbox that</text>
<text x="562" y="45">attaches, now or later</text>
<text x="562" y="104">answers DHCP, binds</text>
<text x="562" y="119">v4 and v6 addresses,</text>
<text x="562" y="134">drops spoofed sources</text>
<text x="562" y="149">and other sandboxes</text>
<text x="562" y="170">a /32 or /128 route per</text>
<text x="562" y="185">address, once bound</text>
</g>
<g font-size="12">
<text x="20" y="508">Default subnets: 10.0.0.0/24 and 2001:db8::/64. Sites without Site::at: 198.18.0.0/15, 2001:2::/48.</text>
<text x="20" y="526">A name’s first lookup runs the callback. Then its site gets a machine and a route.</text>
<text x="20" y="544">Port 443 is open only on a machine with a TLS site. Other TCP ports get a RST.</text>
</g>
</g>
</svg>
