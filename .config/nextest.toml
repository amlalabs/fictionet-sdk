# cargo-nextest runs each test in its own process, all binaries at once.
# `cargo nextest run` does not run doctests; `cargo test --doc` does.
# See CONTRIBUTING.md.

# Tests that run whole worlds on real time and real sockets. They pass when
# the machine is oversubscribed, but each holds threads and descriptors for
# seconds, so a few at a time is enough.
[test-groups]
worlds = { max-threads = 8 }
# Tests that flood a world as fast as they can, or use up descriptors on
# purpose: one at a time.
heavy = { max-threads = 1 }

[profile.default]
# One test per CPU.
test-threads = "num-cpus"
# A flaky test fails the run; it is not retried into a pass.
retries = 0
# Flag a test after 15 seconds, and stop it after 8 periods (2 minutes).
# The slowest tests wait on 10-second protocol timeouts.
slow-timeout = { period = "15s", terminate-after = 8 }
fail-fast = false

[[profile.default.overrides]]
filter = "binary(it) & test(/^(flood|stress|fd_limit)::/)"
test-group = "heavy"

[[profile.default.overrides]]
filter = """
binary(host) | (binary(it) & test(
  /^(web|listen|tcpudp|core|e2e|attach_bin|tap_bin|proxy|tls|observe|observe_bin|observe_tls)::/
))
"""
test-group = "worlds"
