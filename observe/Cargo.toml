[package]
name = "fictionet-observe"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Bounded observation collectors for Fictionet."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
decode = ["dep:hickory-proto", "dep:ring"]
native = ["decode"]
tracing = ["dep:tracing"]

[dependencies]
fictionet = { path = "..", default-features = false }
arc-swap = "1.9.3"
hickory-proto = { version = "0.26.3", optional = true, default-features = false, features = ["std"] }
ring = { version = "0.17", optional = true }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# The tests run real worlds on threads, which needs the SDK on std.
fictionet = { path = "..", default-features = false, features = ["std"] }
