[package]
name = "fictionet-observe"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Bounded observation collectors for Fictionet."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
decode = ["dep:hickory-proto", "dep:ring"]
native = ["decode"]
page = ["native", "dep:tokio", "dep:serde", "dep:serde_json", "dep:serde_path_to_error", "dep:getrandom"]
tracing = ["dep:tracing"]

[dependencies]
fictionet = { path = "..", default-features = false }
arc-swap = "1.9.3"
hickory-proto = { version = "0.26.3", optional = true, default-features = false, features = ["std"] }
ring = { version = "0.17", optional = true }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
serde_path_to_error = { version = "0.1", optional = true }
getrandom = { version = "0.4", optional = true }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# The tests run real worlds on threads, which needs the SDK on std.
fictionet = { path = "..", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["signal"] }

[[example]]
name = "page_fixture"
required-features = ["page"]
