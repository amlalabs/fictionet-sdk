[package]
name = "fictionet-observe"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Bounded observation collectors for Fictionet."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
decode = []
native = ["decode"]
tracing = ["dep:tracing"]

[dependencies]
fictionet = { path = "..", default-features = false }
arc-swap = "1.9.3"
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
