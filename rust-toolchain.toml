# The development toolchain. Pinned, so a new stable release with new
# lints cannot fail the checks by itself: move it forward on purpose, fix
# what the new lints find, and commit both together. rust-version in
# Cargo.toml and the Rust version the docs name move with it. fuzz/ has its
# own file, for nightly.
[toolchain]
channel = "1.99.0"
components = ["clippy", "rustfmt"]
