\* Must violate ReassemblyPaid: reassembly copies a fragment in, then drops the soonest while past the cap (the code before make_room).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Keys = {k1, k2, k3}
    Cap = 9
    PartialCost = 3
    PieceCost = 1
    ExpiredCost = 1
    Datas = {1, 2}
    Budget = 9
    Header = 1
    Place = 1
    Segs = 2
    MaxSteps = 7
    RoomFirst = FALSE
    MoveFirst = TRUE
    ChargeFirst = TRUE
    HeadersPaid = TRUE
INVARIANTS
    ReassemblyPaid
    ReassemblyWithinCap
    ReassemblyTracks
    SocketPaid
    SocketWithinBudget
    SocketTracks
    StorePaid
    StoreTracks
