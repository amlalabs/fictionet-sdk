\* expect violation: EndedLast
\* If a socket's end went up while datagrams were still queued, a datagram
\* would follow it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ports = {1}
    MaxChildren = 2
    MaxArrivals = 2
    MaxGrant = 1
    Queue = 2
    DatagramCost = 1
    CheckValid = TRUE
    KeepEmpty = TRUE
    RemoveOnClose = TRUE
    QueueInSocket = TRUE
    FreePort = TRUE
    EndAfterQueue = FALSE
INVARIANT EndedLast
