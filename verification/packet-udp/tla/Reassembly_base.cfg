\* The code: one network reaches the IP layer, expiry before each fragment,
\* the cap, overlap rejected, pieces laid out by offset. It refines the
\* RFCs' reassembly (RfcReassembly.tla).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Nets = {outer, inner}
    Mine = outer
    Keys = {k1, k2}
    Data = {d1, d2}
    PartialCost = 2
    PieceCost = 1
    MaxWaiting = 5
    Timeout = 2
    MaxTime = 3
    MaxArrivals = 6
    BindScope = TRUE
    ExpireOnPush = TRUE
    Evict = TRUE
    Overlap = "reject"
    ByOffset = TRUE
INVARIANT TypeOK
INVARIANT NoScopeMix
INVARIANT WithinBudget
INVARIANT SizeAccounts
INVARIANT NoLateJoin
INVARIANT RfcWholeOnly
INVARIANT RfcInTime
INVARIANT RfcTheirBytes
INVARIANT RfcOnceEach
PROPERTY RfcSpec
