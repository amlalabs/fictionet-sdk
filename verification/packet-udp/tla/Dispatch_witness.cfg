\* expect violation: NoReassembledError
\* A witness, not a control: the code hands a reassembled ICMP error
\* quoting UDP up, so the base's refinement covers that case.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ids = {1, 2}
    GramKinds = {"errudp"}
    MaxSends = 1
    CheckUpSlot = TRUE
    CheckAnswerSlot = TRUE
    FilterAnswers = TRUE
    QuoteErrors = TRUE
INVARIANT NoReassembledError
