\* expect violation: NoMixedBytes
\* A witness, not a control: with the base's constants a packet whose two
\* fragments carry different bytes is handed up, so RfcTheirBytes and the
\* refinement's bytes are checked on packets where the order matters.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Nets = {outer, inner}
    Mine = outer
    Keys = {k1, k2}
    Data = {d1, d2}
    PartialCost = 2
    PieceCost = 1
    MaxWaiting = 5
    Timeout = 2
    MaxTime = 3
    MaxArrivals = 6
    BindScope = TRUE
    ExpireOnPush = TRUE
    Evict = TRUE
    Overlap = "reject"
    ByOffset = TRUE
INVARIANT NoMixedBytes
