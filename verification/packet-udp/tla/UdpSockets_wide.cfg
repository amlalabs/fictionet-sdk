\* The code, with four arrivals and two units of credit. Two children (one
\* close and rebind) instead of the base's three: with three, this config
\* ran 27 minutes before and now passes the 3 GB cap of the shared runs.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ports = {1, 2}
    MaxChildren = 2
    MaxArrivals = 4
    MaxGrant = 2
    Queue = 2
    DatagramCost = 1
    CheckValid = TRUE
    KeepEmpty = TRUE
    RemoveOnClose = TRUE
    QueueInSocket = TRUE
    FreePort = TRUE
    EndAfterQueue = TRUE
INVARIANT NoCrossSocket
INVARIANT OnlyValid
INVARIANT Accounted
INVARIANT QueueBounded
INVARIANT RetiredSilent
INVARIANT EndedLast
INVARIANT PortsMatch
