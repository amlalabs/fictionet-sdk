\* expect violation: NoFlaggedHeader
\* A witness, not a control: a flagged packet with uncovered header cells
\* in front (after Prepend, or as it arrived) is reached, so writes that
\* keep the flag are checked.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Handles = {h1, h2}
    Backings = {b1, b2}
    Cap = 3
    Broken = "none"
INVARIANT NoFlaggedHeader
