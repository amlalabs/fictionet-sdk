\* expect violation: NoDeadPacket
\* A witness, not a control: with the base's constants an overlap kills a
\* packet, so the kill and dead-packet branches are in the base's runs.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Nets = {outer, inner}
    Mine = outer
    Keys = {k1, k2}
    Data = {d1, d2}
    PartialCost = 2
    PieceCost = 1
    MaxWaiting = 5
    Timeout = 2
    MaxTime = 3
    MaxArrivals = 6
    BindScope = TRUE
    ExpireOnPush = TRUE
    Evict = TRUE
    Overlap = "reject"
    ByOffset = TRUE
INVARIANT NoDeadPacket
