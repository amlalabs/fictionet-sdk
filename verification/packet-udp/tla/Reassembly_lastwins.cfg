\* expect violation: RfcSpec
\* Last-wins overlap: a fragment at a place already taken with other bytes
\* replaces the one there. RFC 8200 section 4.5 and RFC 5722 abandon the
\* packet instead.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Nets = {outer, inner}
    Mine = outer
    Keys = {k1}
    Data = {d1, d2}
    PartialCost = 2
    PieceCost = 1
    MaxWaiting = 5
    Timeout = 2
    MaxTime = 3
    MaxArrivals = 4
    BindScope = TRUE
    ExpireOnPush = TRUE
    Evict = TRUE
    Overlap = "last"
    ByOffset = TRUE
PROPERTY RfcSpec
