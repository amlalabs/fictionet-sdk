\* expect violation: Accounted
\* If take_in skipped datagrams with no payload, an empty datagram for a
\* bound socket would be neither queued, reported nor delivered.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ports = {1}
    MaxChildren = 2
    MaxArrivals = 2
    MaxGrant = 1
    Queue = 2
    DatagramCost = 1
    CheckValid = TRUE
    KeepEmpty = FALSE
    RemoveOnClose = TRUE
    QueueInSocket = TRUE
    FreePort = TRUE
    EndAfterQueue = TRUE
INVARIANT Accounted
