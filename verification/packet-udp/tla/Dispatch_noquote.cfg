\* expect violation: RfcSpec
\* If Sort::read sent every ICMP error to the host's ICMP instead of the
\* transport whose packet it quotes, an error about a UDP or TCP packet
\* would go to a protocol RFC 1122 section 3.2.2 does not name.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ids = {1, 2}
    GramKinds = {"udp"}
    MaxSends = 1
    CheckUpSlot = TRUE
    CheckAnswerSlot = TRUE
    FilterAnswers = TRUE
    QuoteErrors = FALSE
PROPERTY RfcSpec
