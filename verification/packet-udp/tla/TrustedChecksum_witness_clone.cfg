\* expect violation: NoFlaggedClone
\* A witness, not a control: two flagged clones share a backing in the
\* base's runs, so the shared-backing rule is checked with flags set.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Handles = {h1, h2}
    Backings = {b1, b2}
    Cap = 3
    Broken = "none"
INVARIANT NoFlaggedClone
