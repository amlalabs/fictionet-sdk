\* expect violation: FlagMeansValid
\* A write in place through one of two clones that share a backing: the
\* writer's flag clears, but the other clone keeps its flag over bytes that
\* changed under it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Handles = {h1, h2}
    Backings = {b1, b2}
    Cap = 3
    Broken = "sharedwrite"
INVARIANT FlagMeansValid
