\* expect violation: RfcSpec
\* `finish` laying the pieces out in the order they arrived instead of by
\* offset: when the last fragment comes first, its bytes go first, so the
\* bytes handed up are not the ones each fragment carried at its offset
\* (RFC 791 section 3.2).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Nets = {outer, inner}
    Mine = outer
    Keys = {k1}
    Data = {d1, d2}
    PartialCost = 2
    PieceCost = 1
    MaxWaiting = 5
    Timeout = 2
    MaxTime = 3
    MaxArrivals = 4
    BindScope = TRUE
    ExpireOnPush = TRUE
    Evict = TRUE
    Overlap = "reject"
    ByOffset = FALSE
PROPERTY RfcSpec
