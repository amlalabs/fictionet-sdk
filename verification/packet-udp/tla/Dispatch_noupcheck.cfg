\* expect violation: NothingLost
\* If on_event took a packet while one waited to go up, the waiting one
\* would be overwritten.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ids = {1, 2}
    GramKinds = {"udp"}
    MaxSends = 1
    CheckUpSlot = FALSE
    CheckAnswerSlot = TRUE
    FilterAnswers = TRUE
    QuoteErrors = TRUE
INVARIANT NothingLost
