\* expect violation: QueueBounded
\* If a datagram cost only its bytes (DATAGRAM_COST zero), empty datagrams
\* would never fill a socket's queue.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ports = {1}
    Nets = {mine, tunnel}
    Mine = mine
    MaxChildren = 2
    MaxArrivals = 3
    MaxGrant = 1
    Queue = 2
    DatagramCost = 0
    CheckScope = TRUE
    CheckChecked = TRUE
    KeepEmpty = TRUE
    RemoveOnClose = TRUE
    QueueInSocket = TRUE
    FreePort = TRUE
    EndAfterQueue = TRUE
INVARIANT QueueBounded
