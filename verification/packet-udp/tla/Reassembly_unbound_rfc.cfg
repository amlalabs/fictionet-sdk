\* One IP layer fed two networks still refines the RFCs' reassembly, which
\* knows only keys: the tunnel's fragment and the world's are, to it, one
\* datagram's. Keeping networks apart is NetworkInput's job, ahead of
\* reassembly, and NoScopeMix (Reassembly_unbound) is what catches it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Nets = {outer, inner}
    Mine = outer
    Keys = {k1}
    Data = {d1, d2}
    PartialCost = 2
    PieceCost = 1
    MaxWaiting = 5
    Timeout = 2
    MaxTime = 3
    MaxArrivals = 5
    BindScope = FALSE
    ExpireOnPush = TRUE
    Evict = TRUE
    Overlap = "reject"
    ByOffset = TRUE
PROPERTY RfcSpec
