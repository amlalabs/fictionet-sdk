\* expect violation: RetiredSilent
\* If close only freed the port and left the socket in its slot,
\* socket_event would still hand up its queued datagrams.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ports = {1}
    Nets = {mine, tunnel}
    Mine = mine
    MaxChildren = 2
    MaxArrivals = 2
    MaxGrant = 1
    Queue = 2
    DatagramCost = 1
    CheckScope = TRUE
    CheckChecked = TRUE
    KeepEmpty = TRUE
    RemoveOnClose = FALSE
    QueueInSocket = TRUE
    FreePort = TRUE
    EndAfterQueue = TRUE
INVARIANT RetiredSilent
