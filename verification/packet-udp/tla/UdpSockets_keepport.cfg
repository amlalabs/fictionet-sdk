\* expect violation: PortsMatch
\* If close kept the port, the port map would name a closed socket.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ports = {1}
    Nets = {mine, tunnel}
    Mine = mine
    MaxChildren = 2
    MaxArrivals = 1
    MaxGrant = 1
    Queue = 2
    DatagramCost = 1
    CheckScope = TRUE
    CheckChecked = TRUE
    KeepEmpty = TRUE
    RemoveOnClose = TRUE
    QueueInSocket = TRUE
    FreePort = FALSE
    EndAfterQueue = TRUE
INVARIANT PortsMatch
