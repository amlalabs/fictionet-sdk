\* expect violation: FlagMeansChecked
\* A write to a covered byte that leaves the flag set: the flag no longer
\* describes the bytes it was checked over.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Handles = {h1, h2}
    Backings = {b1, b2}
    Cap = 3
    Broken = "writekeeps"
INVARIANT FlagMeansChecked
