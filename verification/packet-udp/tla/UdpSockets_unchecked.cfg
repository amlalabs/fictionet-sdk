\* expect violation: OnlyValid
\* Without the checks at the top of take_in (sort, protocol, address or
\* group, length and checksum), a datagram with a bad checksum reaches the
\* socket bound to its port.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ports = {1}
    MaxChildren = 2
    MaxArrivals = 2
    MaxGrant = 1
    Queue = 2
    DatagramCost = 1
    CheckValid = FALSE
    KeepEmpty = TRUE
    RemoveOnClose = TRUE
    QueueInSocket = TRUE
    FreePort = TRUE
    EndAfterQueue = TRUE
INVARIANT OnlyValid
