\* expect violation: NoCrossSocket
\* If the queue belonged to the port rather than the socket, a socket
\* bound again on a closed socket's port would receive what had been
\* queued for the old one.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ports = {1}
    MaxChildren = 2
    MaxArrivals = 2
    MaxGrant = 1
    Queue = 2
    DatagramCost = 1
    CheckValid = TRUE
    KeepEmpty = TRUE
    RemoveOnClose = TRUE
    QueueInSocket = FALSE
    FreePort = TRUE
    EndAfterQueue = TRUE
INVARIANT NoCrossSocket
