\* The other fix Astra named: one table for every network, keyed by the
\* network too. Reassembly alone then keeps networks apart; the layer still
\* sends answers down without a network, which is why the code binds one
\* network per layer instead.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Nets = {outer, inner}
    Mine = outer
    Keys = {k1}
    Data = {d1, d2}
    PartialCost = 2
    PieceCost = 1
    MaxWaiting = 5
    Timeout = 2
    MaxTime = 3
    MaxArrivals = 6
    BindScope = FALSE
    KeyHasScope = TRUE
    ExpireOnPush = TRUE
    Evict = TRUE
INVARIANT TypeOK
INVARIANT NoScopeMix
INVARIANT WithinBudget
INVARIANT SizeAccounts
INVARIANT NoLateJoin
