\* expect violation: NoScopeMix
\* The code before the first pass: one IP layer takes every network's
\* packets into one table keyed without the network, so the tunnel's first
\* fragment and the world's last make one packet.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Nets = {outer, inner}
    Mine = outer
    Keys = {k1}
    Data = {d1, d2}
    PartialCost = 2
    PieceCost = 1
    MaxWaiting = 5
    Timeout = 2
    MaxTime = 3
    MaxArrivals = 4
    BindScope = FALSE
    ExpireOnPush = TRUE
    Evict = TRUE
    Overlap = "reject"
    ByOffset = TRUE
INVARIANT NoScopeMix
