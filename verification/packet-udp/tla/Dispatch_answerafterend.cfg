\* expect violation: NoSendAfterEnd
\* If take_in answered after the transports ended the output, the answer
\* would go down after the end.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ids = {1, 2}
    CheckUpSlot = TRUE
    CheckAnswerSlot = TRUE
    FilterAnswers = FALSE
INVARIANT NoSendAfterEnd
