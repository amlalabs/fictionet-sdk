\* The code. It refines a host's IP input as RFC 1122 sections 3.2.1 and
\* 3.2.2 describe it (RfcIpInput.tla). A reassembled packet is a UDP
\* datagram or an ICMP error quoting TCP.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ids = {1, 2, 3}
    GramKinds = {"udp", "errtcp"}
    MaxSends = 2
    CheckUpSlot = TRUE
    CheckAnswerSlot = TRUE
    FilterAnswers = TRUE
    QuoteErrors = TRUE
INVARIANT TypeOK
INVARIANT NothingLost
INVARIANT ExactlyOnce
INVARIANT AnswersKept
INVARIANT NoSendAfterEnd
INVARIANT EndedOnce
PROPERTY RfcSpec
