\* expect violation: AnswersKept
\* If on_event looked only at the up slot, a second refused packet would
\* overwrite the first one's answer before it went down.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ids = {1, 2}
    GramKinds = {"udp"}
    MaxSends = 1
    CheckUpSlot = TRUE
    CheckAnswerSlot = FALSE
    FilterAnswers = TRUE
    QuoteErrors = TRUE
INVARIANT AnswersKept
