\* expect violation: WithinBudget
\* Without the cap loop at the end of `reassemble`, unfinished packets
\* under several keys pass MAX_WAITING.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Nets = {outer, inner}
    Mine = outer
    Keys = {k1, k2}
    Data = {d1, d2}
    PartialCost = 2
    PieceCost = 1
    MaxWaiting = 5
    Timeout = 2
    MaxTime = 3
    MaxArrivals = 4
    BindScope = TRUE
    ExpireOnPush = TRUE
    Evict = FALSE
    Overlap = "reject"
    ByOffset = TRUE
INVARIANT WithinBudget
