\* The run loop counts a failed task as ended, which cancels its region,
\* before it stores the joiner's result. A joiner in that region polled in
\* between hears Cancelled instead of the failure.
\* expect violation: JoinerSeesFailure
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Tasks = {a, b}
    Joined = a
    FinishBeforeDone = FALSE
    DoneWakes = TRUE
    CancelBeforeEnd = TRUE
INVARIANT JoinerSeesFailure
