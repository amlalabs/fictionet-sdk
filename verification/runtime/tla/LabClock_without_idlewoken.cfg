\* A lab wakes its idle waits at every quiet turn. A task that waits for
\* idle in a loop is woken again and again, and the clock never jumps to
\* the deadline another task sleeps for.
\* expect violation: SleepersWake
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Tasks = {1, 2}
    Deadlines = {1, 2}
    MaxSpurious = 1
    IdleWoken = FALSE
    FreshIdOnReset = TRUE
    MaxOnAdvance = TRUE
    MaxArms = 2
PROPERTY SleepersWake
