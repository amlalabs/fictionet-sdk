\* RunState::poll leaves TaskWaker::queued set while it polls a task. A
\* wake that arrives during the poll finds the task queued and does nothing,
\* so the task is never polled again.
\* expect violation: WakesArePolled
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Tasks = {1, 2}
    ResetQueued = FALSE
    WakeOnMore = TRUE
PROPERTY WakesArePolled
