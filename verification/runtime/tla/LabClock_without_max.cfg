\* Clock::advance sets the clock to the earliest deadline even when that
\* deadline is in the past: a harness thread registered it from a stale
\* clock reading, and the lab's time runs backwards.
\* expect violation: Monotonic
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Tasks = {1, 2}
    Deadlines = {1, 2}
    MaxSpurious = 1
    IdleWoken = TRUE
    FreshIdOnReset = TRUE
    MaxOnAdvance = FALSE
    MaxArms = 2
PROPERTY Monotonic
