\* Clock::reset keeps a moved timer's registration id. Moved to an instant
\* another timer set earlier, it wakes before that timer.
\* expect violation: WakesInOrderAndInTime
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Tasks = {1, 2}
    Deadlines = {1, 2}
    MaxSpurious = 1
    IdleWoken = TRUE
    FreshIdOnReset = FALSE
    MaxOnAdvance = TRUE
    MaxArms = 2
INVARIANT WakesInOrderAndInTime
