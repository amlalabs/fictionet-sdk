\* RunState::poll returns Pending without waking itself when tasks were
\* queued during the turn. Nothing else wakes the outer, so the queued
\* tasks wait forever.
\* expect violation: OuterIsWoken
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Tasks = {1, 2}
    ResetQueued = TRUE
    WakeOnMore = FALSE
INVARIANT OuterIsWoken
