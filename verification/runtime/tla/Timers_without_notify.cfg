\* Timers::add and reset do not notify the thread of an earlier deadline.
\* The thread sleeps past it, or forever when it had nothing to wait for.
\* expect violation: SleepIsSafe
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Ids = {1, 2}
    MaxTime = 3
    StaleCheck = TRUE
    Notify = FALSE
INVARIANT SleepIsSafe
