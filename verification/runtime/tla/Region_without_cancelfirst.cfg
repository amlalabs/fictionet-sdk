\* Drop for RunState counts the dropped tasks as ended before it cancels
\* the regions. An owner outside the run, woken by the last task ending,
\* finds its region complete and not cancelled, and returns Ok for work
\* that never finished.
\* expect violation: DroppedRunIsCancelled
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Tasks = {a, b}
    Joined = a
    FinishBeforeDone = TRUE
    DoneWakes = TRUE
    CancelBeforeEnd = FALSE
INVARIANT DroppedRunIsCancelled
