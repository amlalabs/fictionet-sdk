\* Server 1 of alt.tld adds a record for www.sld.tld to its answer for the
\* wildcard name; the client then asks www.sld.tld.
CONSTANTS
    None = None
    Clients = {c1}
    Script <- ScriptRogue
    MaxTime = 4
    MaxWork = 4
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 0
    MaxSpoof = 0
    Ports = {1}
    IDs = {1}
    Rogue = TRUE
    CheckBailiwick = TRUE
    BoundWork = TRUE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
    CacheBounded = FALSE
    CountDown = TRUE
    CheckId = TRUE
    CheckPort = TRUE
    CheckType = TRUE
    CacheByName = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    AnswersTrueWithinTtl
    NegativeTrue
    NoPoison
    GlueNeverAnswers
    TtlSound
    CachedNegativeTrue
    FailureNeverNegative
    CachedFailureTriedAll
    WorkBounded
    LoopServfails
PROPERTIES
    ReferralsDescend
    EveryQueryAnswered
