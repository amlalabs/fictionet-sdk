\* Free: the provider and signer implementation of each of two validator
\* runs over the same records, with signers A or B and RRsets that may have
\* changed after signing.
CONSTANTS
    AnchorChoices = {"A"}
    SignerChoices = {"A", "B"}
    ProofChoices = {"DsA"}
    WindowChoices = {"now"}
    AlgChoices = {"supported"}
    ChangedChoices = {FALSE, TRUE}
    ClockChoices = {"now"}
    ReachChoices = {TRUE}
    ProviderChoices = {"Complete", "Lazy", "Copied"}
    ImplChoices = {"A", "B"}
    PolicyAlgs = {"supported"}
    TrustUpstreamAd = FALSE
    MissingAsInsecure = FALSE
    SignerPeek = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    SecureImpliesChain
    InsecureNeedsProof
    NoDowngrade
    IndeterminateOnlyUnreachable
    AdOnlySecure
    BogusServfails
    CdPassesData
    Sha1Insecure
    RecordsOnly
    CheckChainAgrees
    UnreachableLinkIndeterminate
    CopiedEditedNeverSecure
