\* One client asks an address, a CNAME to it, an empty non-terminal, a
\* missing name, and a wildcard name, with one loss and one truncation.
CONSTANTS
    None = None
    Clients = {c1}
    Script <- ScriptBase
    MaxTime = 4
    MaxWork = 4
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 0
    Rogue = FALSE
    CheckBailiwick = TRUE
    BoundWork = TRUE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
    CacheBounded = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    AnswersTrueWithinTtl
    NegativeTrue
    NoPoison
    GlueNeverAnswers
    TtlSound
    TcNotCached
    FailureNeverNegative
    BoundedNotCached
    WorkBounded
    LoopServfails
PROPERTIES
    ReferralsDescend
    EveryQueryAnswered
