\* The base configuration with one new session (Advance) during the work.
CONSTANTS
    None = None
    Clients = {c1, c2}
    ServerAddrs = {s1, s2}
    Attacker = attacker
    MaxTime = 3
    MaxExchanges = 4
    MaxGeneration = 2
    MaxDup = 1
    MaxSpoof = 1
    MaxGone = 0
    IdOnly = FALSE
    FlushOnly = FALSE
    CancelShared = FALSE
    NoToken = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    ObsoleteNeverPopulates
    CancelPreservesWaiters
    OneAnswerPerQuery
PROPERTIES
    MatchRequiresTuple
    DuplicateHarmless
    EveryAcceptedAnswered
