    UnknownAsAbsent = FALSE
    MixedRevision = FALSE
    ReaskTimeout = FALSE
    ParkInView = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    NeverGuess
    PolicyHolds
    UnknownNeverNegative
    CoherentRevision
    RespondMonotone
    OneAskPerNeed
    NoLockAcrossAsk
PROPERTIES
