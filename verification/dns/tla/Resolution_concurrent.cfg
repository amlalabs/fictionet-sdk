\* Two clients ask the CNAME and its target, sharing resolutions and the
\* cache. Clients are symmetric here; Resolution_concurrent_live.cfg checks
\* liveness without symmetry.
CONSTANTS
    None = None
    Clients = {c1, c2}
    Script <- ScriptConcurrent
    MaxTime = 4
    MaxWork = 4
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 0
    Rogue = FALSE
    CheckBailiwick = TRUE
    BoundWork = TRUE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
    CacheBounded = FALSE
    CountDown = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
INVARIANTS
    AnswersTrueWithinTtl
    NegativeTrue
    NoPoison
    GlueNeverAnswers
    TtlSound
    CachedNegativeTrue
    FailureNeverNegative
    CachedFailureTriedAll
    WorkBounded
    LoopServfails
PROPERTIES
    ReferralsDescend
