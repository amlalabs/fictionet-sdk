\* expect violation: BoundIsOwn
\* The concurrent configuration with the work bound the resolution's own:
\* only the client that started it pays, so a client that joined fails
\* when the other's budget runs out.
CONSTANTS
    None = None
    Clients = {c1, c2}
    Script <- ScriptConcurrent
    MaxTime = 4
    MaxWork = 4
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 0
    MaxSpoof = 0
    Ports = {1}
    IDs = {1}
    Rogue = FALSE
    CheckBailiwick = TRUE
    BoundWork = TRUE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
    CacheBounded = FALSE
    CountDown = TRUE
    CheckId = TRUE
    CheckPort = TRUE
    CheckType = TRUE
    CacheByName = FALSE
    SharedBound = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
SYMMETRY Symmetry
INVARIANT
    BoundIsOwn
