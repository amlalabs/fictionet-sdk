\* Free: the provider of each of two validator runs, which zones the world
\* edited, the anchor, each zone's signer, and each parent's DS or no-DS
\* proof. Signatures are current, algorithms supported, everything
\* reachable, and nothing changed after signing but by an edit to a copy.
CONSTANTS
    AnchorChoices = {"A", "B"}
    SignerChoices = {"A", "B", "none"}
    ProofChoices = {"DsA", "DsB", "NoDs"}
    WindowChoices = {"now"}
    AlgChoices = {"supported"}
    ChangedChoices = {FALSE}
    EditedChoices = {FALSE, TRUE}
    ClockChoices = {"now"}
    ReachChoices = {TRUE}
    ProviderChoices = {"Complete", "Lazy", "Copied"}
    ImplChoices = {"A"}
    PolicyAlgs = {"supported"}
    TrustUpstreamAd = FALSE
    MissingAsInsecure = FALSE
    SignerPeek = FALSE
    ResignCopies = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    SecureImpliesChain
    InsecureNeedsProof
    NoDowngrade
    IndeterminateOnlyUnreachable
    AdOnlySecure
    BogusServfails
    CdPassesData
    Sha1Insecure
    RecordsOnly
    CheckChainAgrees
    UnreachableLinkIndeterminate
    CopiedEditedNeverSecure
