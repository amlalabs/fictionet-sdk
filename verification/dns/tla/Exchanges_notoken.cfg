\* expect violation: ObsoleteNeverPopulates
\* The advance configuration matching replies on the tuple alone, without
\* the token: a late reply to an exchange of the old generation completes
\* the new generation's exchange to the same server.
CONSTANTS
    None = None
    Clients = {c1, c2}
    ServerAddrs = {s1, s2}
    Attacker = attacker
    MaxTime = 3
    MaxExchanges = 4
    MaxGeneration = 2
    MaxDup = 1
    MaxSpoof = 1
    MaxGone = 0
    IdOnly = FALSE
    FlushOnly = FALSE
    CancelShared = FALSE
    NoToken = TRUE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANT
    ObsoleteNeverPopulates
