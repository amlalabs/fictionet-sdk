\* Free: the anchor, each zone's signer, and each parent's proof. Signatures
\* are current, algorithms supported, nothing changed, everything reachable.
CONSTANTS
    AnchorChoices = {"none", "elsewhere", "A", "B"}
    SignerChoices = {"A", "B", "none"}
    ProofChoices = {"DsA", "DsB", "NoDs", "OptOutCover", "Nsec", "Nothing"}
    WindowChoices = {"now"}
    AlgChoices = {"supported"}
    ChangedChoices = {FALSE}
    ClockChoices = {"now"}
    ReachChoices = {TRUE}
    ProviderChoices = {"Complete", "Lazy", "Relayed"}
    ImplChoices = {"A"}
    PolicyAlgs = {"supported"}
    TrustUpstreamAd = FALSE
    MissingAsInsecure = FALSE
    SignerPeek = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    SecureImpliesChain
    InsecureNeedsProof
    NoDowngrade
    IndeterminateOnlyUnreachable
    AdOnlySecure
    BogusServfails
    CdPassesData
    Sha1Insecure
    RecordsOnly
    CheckChainAgrees
