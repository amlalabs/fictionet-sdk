\* One world edit changes www and ns and creates nx while the client asks
\* www (caching the glue for ns), ns, and nx.
CONSTANTS
    None = None
    Clients = {c1}
    Script <- ScriptEdit
    MaxTime = 4
    MaxWork = 4
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 1
    MaxSpoof = 0
    Ports = {1}
    IDs = {1}
    Rogue = FALSE
    CheckBailiwick = TRUE
    BoundWork = TRUE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
    CacheBounded = FALSE
    CountDown = TRUE
    CheckId = TRUE
    CheckPort = TRUE
    CheckType = TRUE
    CacheByName = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    AnswersTrueWithinTtl
    NegativeTrue
    NoPoison
    GlueNeverAnswers
    TtlSound
    CachedNegativeTrue
    FailureNeverNegative
    CachedFailureTriedAll
    WorkBounded
    LoopServfails
PROPERTIES
    ReferralsDescend
    EveryQueryAnswered
