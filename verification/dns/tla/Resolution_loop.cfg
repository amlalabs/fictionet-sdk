\* One client follows the CNAME loop between sld.tld and alt.tld. MaxWork is
\* 6 here, not 4: following the loop once takes five queries, and with 4 the
\* work bound always ends it before the chain bound is reached.
CONSTANTS
    None = None
    Clients = {c1}
    Script <- ScriptLoop
    MaxTime = 4
    MaxWork = 6
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 0
    MaxSpoof = 0
    Ports = {1}
    IDs = {1}
    Rogue = FALSE
    CheckBailiwick = TRUE
    BoundWork = TRUE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
    CacheBounded = FALSE
    CountDown = TRUE
    CheckId = TRUE
    CheckPort = TRUE
    CheckType = TRUE
    CacheByName = FALSE
    SharedBound = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    AnswersTrueWithinTtl
    NegativeTrue
    NoPoison
    GlueNeverAnswers
    TtlSound
    CachedNegativeTrue
    FailureNeverNegative
    CachedFailureTriedAll
    WorkBounded
    BoundIsOwn
    LoopServfails
PROPERTIES
    ReferralsDescend
    EveryQueryAnswered
