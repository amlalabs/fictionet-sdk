\* Two clients ask the CNAME and its target, sharing resolutions and the
\* cache: liveness, checked without symmetry.
CONSTANTS
    None = None
    Clients = {c1, c2}
    Script <- ScriptConcurrent
    MaxTime = 4
    MaxWork = 4
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 0
    Rogue = FALSE
    CheckBailiwick = TRUE
    BoundWork = TRUE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
PROPERTY
    EveryQueryAnswered
