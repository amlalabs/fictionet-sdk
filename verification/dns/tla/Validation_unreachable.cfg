\* Free: which zones can be fetched, and the algorithm each DS names, with
\* signed or unsigned zones under DS links, no-DS proofs, and opt-out covers.
CONSTANTS
    AnchorChoices = {"A"}
    SignerChoices = {"A", "none"}
    ProofChoices = {"DsA", "NoDs", "OptOutCover", "NsecNoNs"}
    WindowChoices = {"now"}
    AlgChoices = {"supported", "sha1"}
    ChangedChoices = {FALSE}
    EditedChoices = {FALSE}
    ClockChoices = {"now"}
    ReachChoices = {FALSE, TRUE}
    ImplChoices = {"A"}
    PolicyAlgs = {"supported"}
    TrustUpstreamAd = FALSE
    MissingAsInsecure = FALSE
    SignerPeek = FALSE
    CheckNsBit = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    SecureImpliesChain
    InsecureNeedsProof
    NoDowngrade
    IndeterminateOnlyUnreachable
    AdOnlySecure
    BogusServfails
    CdPassesData
    Sha1Insecure
    RecordsOnly
    CheckChainAgrees
    UnreachableLinkIndeterminate
