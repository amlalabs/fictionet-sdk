\* Free: which zones can be fetched, with signed or unsigned zones under DS
\* links, no-DS proofs, and opt-out covers.
CONSTANTS
    AnchorChoices = {"A"}
    SignerChoices = {"A", "none"}
    ProofChoices = {"DsA", "NoDs", "OptOutCover"}
    WindowChoices = {"now"}
    AlgChoices = {"supported"}
    ChangedChoices = {FALSE}
    ClockChoices = {"now"}
    ReachChoices = {FALSE, TRUE}
    ProviderChoices = {"Complete"}
    ImplChoices = {"A"}
    PolicyAlgs = {"supported"}
    TrustUpstreamAd = FALSE
    MissingAsInsecure = FALSE
    SignerPeek = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    SecureImpliesChain
    InsecureNeedsProof
    NoDowngrade
    IndeterminateOnlyUnreachable
    AdOnlySecure
    BogusServfails
    CdPassesData
    Sha1Insecure
    RecordsOnly
    CheckChainAgrees
