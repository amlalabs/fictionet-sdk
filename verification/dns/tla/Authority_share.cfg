\* Two requests for one real name at the root server, which wait on one
\* lookup, and the same name at the TLD server, with an upstream that may
\* fail.
CONSTANTS
    None = None
    Reqs <- ReqsShare
    MaxRevision = 2
    MaxGeneration = 1
    MaxRealChanges = 1
    Failures = TRUE
    NoPolicy = FALSE
    RootExempt = FALSE
    UnknownAsAbsent = FALSE
    MixedRevision = FALSE
    Reask = FALSE
    ParkInView = FALSE
    NoShare = FALSE
    AnyZone = FALSE
    WakeOne = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    NeverGuess
    PolicyHolds
    UnknownNeverNegative
    CoherentRevision
    OneAskPerNeed
    NoLockAcrossAsk
PROPERTIES
    NoAskAfterReply
    EveryParkedAnswered
