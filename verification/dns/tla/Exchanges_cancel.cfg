\* The base configuration where one client's connection may go (Gone).
CONSTANTS
    None = None
    Clients = {c1, c2}
    ServerAddrs = {s1, s2}
    Attacker = attacker
    MaxTime = 3
    MaxExchanges = 4
    MaxGeneration = 1
    MaxDup = 1
    MaxSpoof = 1
    MaxGone = 1
    IdOnly = FALSE
    FlushOnly = FALSE
    CancelShared = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    ObsoleteNeverPopulates
    CancelPreservesWaiters
    OneAnswerPerQuery
PROPERTIES
    MatchRequiresTuple
    DuplicateHarmless
    EveryAcceptedAnswered
