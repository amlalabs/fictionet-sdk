\* Three requests at the fict server while the world grows (a name the
\* provider first denies and then gives, an unknown name, and a name only
\* the wildcard covers, which comes into being with the world), and the
\* overlay's DS ask parked meanwhile.
CONSTANTS
    None = None
    Reqs <- ReqsLazy
    MaxRevision = 2
    MaxGeneration = 1
    MaxRealChanges = 1
    Failures = FALSE
    NoPolicy = FALSE
    RootExempt = FALSE
    UnknownAsAbsent = FALSE
    MixedRevision = FALSE
    ReaskTimeout = FALSE
    ParkInView = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    NeverGuess
    PolicyHolds
    UnknownNeverNegative
    CoherentRevision
    RespondMonotone
    OneAskPerNeed
    NoLockAcrossAsk
PROPERTIES
    NoAskAfterReply
    EveryParkedAnswered
