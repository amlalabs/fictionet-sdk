\* Two clients share one piece of work; the network duplicates one message
\* and an attacker injects one reply with the right ID and the wrong tuple.
CONSTANTS
    None = None
    Clients = {c1, c2}
    ServerAddrs = {s1, s2}
    Attacker = attacker
    MaxTime = 3
    MaxExchanges = 4
    MaxGeneration = 1
    MaxDup = 1
    MaxSpoof = 1
    MaxGone = 0
    IdOnly = FALSE
    FlushOnly = FALSE
    CancelShared = FALSE
    NoToken = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    ObsoleteNeverPopulates
    CancelPreservesWaiters
    OneAnswerPerQuery
PROPERTIES
    MatchRequiresTuple
    DuplicateHarmless
    EveryAcceptedAnswered
