\* expect violation: EveryQueryAnswered
\* The loop configuration with no work or chain bound: the loop never
\* ends, so one query is never answered. Resolution_nobound checks the
\* same run for the chain bound.
CONSTANTS
    None = None
    Clients = {c1}
    Script <- ScriptLoop
    MaxTime = 4
    MaxWork = 6
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 0
    MaxSpoof = 0
    Ports = {1}
    IDs = {1}
    Rogue = FALSE
    CheckBailiwick = TRUE
    BoundWork = FALSE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
    CacheBounded = FALSE
    CountDown = TRUE
    CheckId = TRUE
    CheckPort = TRUE
    CheckType = TRUE
    CacheByName = FALSE
    SharedBound = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
PROPERTY
    EveryQueryAnswered
