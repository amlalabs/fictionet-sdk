\* One client asks an address while the attacker forges a reply: every
\* query goes out from one of two ports with one of two IDs.
CONSTANTS
    None = None
    Clients = {c1}
    Script <- ScriptSpoof
    MaxTime = 4
    MaxWork = 4
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 0
    MaxSpoof = 1
    Ports = {1, 2}
    IDs = {1, 2}
    Rogue = FALSE
    CheckBailiwick = TRUE
    BoundWork = TRUE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
    CacheBounded = FALSE
    CountDown = TRUE
    CheckId = TRUE
    CheckPort = TRUE
    CheckType = TRUE
    CacheByName = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    AnswersTrueWithinTtl
    NegativeTrue
    NoPoison
    GlueNeverAnswers
    TtlSound
    CachedNegativeTrue
    FailureNeverNegative
    CachedFailureTriedAll
    WorkBounded
    LoopServfails
PROPERTIES
    ReferralsDescend
    EveryQueryAnswered
