\* One client asks a CNAME for AAAA, which ends NODATA at its target, the
\* target for A, and a wildcard name for AAAA (NODATA) and then for A, with
\* one loss and one truncation.
CONSTANTS
    None = None
    Clients = {c1}
    Script <- ScriptTypes
    MaxTime = 4
    MaxWork = 4
    MaxChain = 3
    MaxLoss = 1
    MaxTc = 1
    MaxEdits = 0
    MaxSpoof = 0
    Ports = {1}
    IDs = {1}
    Rogue = FALSE
    CheckBailiwick = TRUE
    BoundWork = TRUE
    CacheTc = FALSE
    CheckExpiry = TRUE
    FailureAsNegative = FALSE
    CacheBounded = FALSE
    CountDown = TRUE
    CheckId = TRUE
    CheckPort = TRUE
    CheckType = TRUE
    CacheByName = FALSE
    SharedBound = FALSE
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
INVARIANTS
    AnswersTrueWithinTtl
    NegativeTrue
    NoPoison
    GlueNeverAnswers
    TtlSound
    CachedNegativeTrue
    FailureNeverNegative
    CachedFailureTriedAll
    WorkBounded
    BoundIsOwn
    LoopServfails
PROPERTIES
    ReferralsDescend
    EveryQueryAnswered
