\* Must violate Bounded: whole messages waiting for the application grow past a message and a window
SPECIFICATION Spec
CONSTANTS
    Calls = {1}
    Header = 2
    Limit = 2
    Window = 1
    Waiting = 2
    MaxMsgs = 4
    MaxChunk = 3
    Lengths = {0, 1, 2, 3}
    CheckLimit = TRUE
    BoundBuffer = FALSE
    EndCheck = TRUE
    EndWhenRoom = TRUE
    CheckEarly = TRUE
    OwnBuffer = TRUE
INVARIANTS
    Bounded
CHECK_DEADLOCK FALSE
