\* Must violate NoError: a block written between applying SETTINGS and acknowledging them carries the reduction before the ACK, and the decoder asks for it again
SPECIFICATION Spec
CONSTANTS
    Initial = 4
    MaxTable = 5
    SettingsVals = {0, 3, 6}
    MaxBlocks = 2
    MaxSettings = 2
    MaxCaps = 1
    Adversary = FALSE
    ImmediateAck = FALSE
    MinPending = TRUE
    SecondUpdate = TRUE
    EncEvict = TRUE
    ResizeOnLower = TRUE
    RaiseOnSend = TRUE
    MinOnAck = TRUE
    CheckSettings = TRUE
    RequireReduction = TRUE
    UpdatesFirst = TRUE
INVARIANTS
    NoError
CHECK_DEADLOCK FALSE
