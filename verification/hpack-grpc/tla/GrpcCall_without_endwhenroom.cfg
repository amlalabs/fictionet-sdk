\* Must violate NoFalseTruncation: whole messages still waiting are taken for a cut-off one
SPECIFICATION Spec
CONSTANTS
    Calls = {1}
    Header = 2
    Limit = 2
    Window = 1
    Waiting = 2
    MaxMsgs = 4
    MaxChunk = 3
    Lengths = {0, 1, 2, 3}
    CheckLimit = TRUE
    BoundBuffer = TRUE
    EndCheck = TRUE
    EndWhenRoom = FALSE
    CheckEarly = TRUE
    OwnBuffer = TRUE
INVARIANTS
    NoFalseTruncation
CHECK_DEADLOCK FALSE
