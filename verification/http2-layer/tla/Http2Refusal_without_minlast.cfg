\* Violates LastNeverGrows: finish sends last_stream as it is, past an earlier GOAWAY's last stream.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams = {1, 3}
  Budget = 4
  Keep = 2
  MaxSteps = 6
  MaxWindow = 7
  Guard = TRUE
  Reserve = TRUE
  KeepPayload = TRUE
  MinLast = FALSE
  WithLastWords = TRUE
  LastOnRead = TRUE
  EndAll = TRUE
  StopReading = TRUE
INVARIANT LastNeverGrows
