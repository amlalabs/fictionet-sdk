\* Violates WholeFrames: over_budget drops the payload of a DATA header the transport took, so GOAWAY lands inside that frame.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams = {1, 3}
  Budget = 4
  Keep = 2
  MaxSteps = 6
  MaxWindow = 7
  Guard = TRUE
  Reserve = TRUE
  KeepPayload = FALSE
  MinLast = TRUE
  WithLastWords = TRUE
  LastOnRead = TRUE
  EndAll = TRUE
  StopReading = TRUE
INVARIANT WholeFrames
