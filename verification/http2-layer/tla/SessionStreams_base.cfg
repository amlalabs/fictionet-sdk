\* The code as it is: client streams 1 and 3 (and the even stream 2 for
\* PRIORITY), four client frames of every kind a client sends, and the
\* caller's resets, ends and retirements; one stream state and one
\* peer-reset id kept, so both watermarks move.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Odd = {1, 3}
  Even = {2}
  Top = 5
  MaxFrames = 4
  SMax = 1
  HVariants = {"ok", "self", "big", "bad"}
  CVariants = {"ok", "bad"}
  PVariants = {"ok", "len", "self"}
  Kinds = {"DATA", "HEADERS", "CONT", "PRIORITY", "RST", "WU", "PUSH"}
  PushFirst = TRUE
  ResetDrops = TRUE
  ClosedCheck = TRUE
  InterleaveCheck = TRUE
  DecodeFirst = TRUE
  TrailersEnd = TRUE
  SelfDep = TRUE
  ContCheck = TRUE
  CompressionCheck = TRUE
  PriorityScope = TRUE
  PriorityIdleOk = TRUE
PROPERTY HalfClosedRemote
PROPERTY ServerResetDiscarded
PROPERTY Interleave
PROPERTY ContWithoutBlock
PROPERTY Compression
PROPERTY BlocksDecoded
PROPERTY PriorityAnyState
PROPERTY PriorityMalformed
PROPERTY SelfDependentHeaders
PROPERTY PushRefused_
PROPERTY TrailersEnd_
