\* Violates RefusalSaysGoaway: the end's GOAWAY is not paid for when the connection opens, and a refusal has nothing to send it with.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams = {1, 3}
  Budget = 4
  Keep = 2
  MaxSteps = 6
  MaxWindow = 7
  Guard = TRUE
  Reserve = TRUE
  KeepPayload = TRUE
  MinLast = TRUE
  WithLastWords = FALSE
  LastOnRead = TRUE
  EndAll = TRUE
  StopReading = TRUE
INVARIANT RefusalSaysGoaway
