\* The code as it is: an Upgrade: h2c request, then the preface and frames,
\* all of which HTTP/1's buffer holds, so the client's end can come
\* before the 101 is written.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Mode = "h2c"
  StreamCap = 4
  LeftoverRoom = 1
  TakeDeciding = TRUE
  HandFirst = TRUE
  LeftoversFirst = TRUE
  KeepUnread = TRUE
  BlockWhenFull = TRUE
  EndAfterData = TRUE
INVARIANT H2GetsTheRest
INVARIANT H2EndLast
INVARIANT H1GetsTheInput
PROPERTY H2GetsAll
