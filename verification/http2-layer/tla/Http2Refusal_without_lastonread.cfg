\* Violates LastCoversActed: a stream becomes the last stream when its header block begins, so a refusal before its CONTINUATION reports it as maybe processed.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams = {1, 3}
  Budget = 4
  Keep = 2
  MaxSteps = 6
  MaxWindow = 7
  Guard = TRUE
  Reserve = TRUE
  KeepPayload = TRUE
  MinLast = TRUE
  WithLastWords = TRUE
  LastOnRead = FALSE
  EndAll = TRUE
  StopReading = TRUE
INVARIANT LastCoversActed
