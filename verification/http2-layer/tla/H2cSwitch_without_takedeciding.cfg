\* `scan` reads the byte that decides into `first` but leaves it in the
\* rest too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Mode = "pk"
  StreamCap = 2
  LeftoverRoom = 1
  TakeDeciding = FALSE
  HandFirst = TRUE
  LeftoversFirst = TRUE
  KeepUnread = TRUE
  BlockWhenFull = TRUE
  EndAfterData = TRUE
INVARIANT H2GetsTheRest
