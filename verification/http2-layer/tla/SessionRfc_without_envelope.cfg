\* Violates BoundCovers: the windows count from the initial window announced last, so DATA A sent under a larger one not yet acknowledged away is past the bound.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Max = 4
  Default = 2
  FrameMin = 1
  FrameLimit = 2
  Streams = {1, 3}
  DataLens = {0, 1, 2}
  Pads <- PeerPads
  Incs = {1, 2, 3, 4}
  SettingsFrames <- PeerSettingsFrames
  MaxFrames = 6
  SkipClosed = TRUE
  LatestCredit = TRUE
  LatestInitial = TRUE
  StreamOverflow = TRUE
  StreamErrors = TRUE
  Envelope = FALSE
  DataEnvelope = TRUE
  CountPadding = TRUE
  CheckConn = TRUE
  CheckConnCredit = TRUE
  AckFront = TRUE
INVARIANT BoundCovers
