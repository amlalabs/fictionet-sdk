  Ids = {1, 3}
  Window = 2
  ChildWindow = 2
  FrameMax = 1
  Body = 3
  H2cBody = 4
  Stalled = {1}
  Resettable = {}
  SendCredit = 2
  Response = 3
  InitialSend = 1
  MaxWindow = 3
  Increments = {1}
  Initials = {0, 2}
  SplitToCredit = TRUE
  HeldOnlyWindowed = FALSE
  CountHeld = TRUE
  FollowChild = TRUE
  ReleaseOnCredit = TRUE
  ReleaseOnEnd = TRUE
  CheckOverflow = TRUE
  SpendWithinWindows = TRUE
  CountOutBytes = TRUE
  RecordGrant = TRUE
PROPERTY RequestsEnd
