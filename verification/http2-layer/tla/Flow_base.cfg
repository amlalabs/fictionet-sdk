\* The code as it is: an h2c stream whose body is larger than its child's
\* credit, and a stream with a body over two windows, both children
\* reading whenever they like.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Ids = {1, 3}
  Window = 2
  ChildWindow = 2
  FrameMax = 1
  Body = 5
  H2cBody = 3
  Stalled = {}
  Resettable = {}
  SendCredit = 2
  Response = 3
  InitialSend = 1
  MaxWindow = 3
  Increments = {1}
  Initials = {0, 2}
  SplitToCredit = TRUE
  HeldOnlyWindowed = TRUE
  CountHeld = TRUE
  FollowChild = TRUE
  ReleaseOnCredit = TRUE
  ReleaseOnEnd = TRUE
  CheckOverflow = TRUE
  SpendWithinWindows = TRUE
  CountOutBytes = TRUE
  RecordGrant = TRUE
INVARIANT TypeOK
INVARIANT ReleasedOnlyFreed
INVARIANT NothingHeld
INVARIANT SendWindowsBounded
INVARIANT ServerSpendsWithinWindows
INVARIANT ChildWithinGrant
INVARIANT CreditAgrees
PROPERTY BodyReachesChild
PROPERTY RequestsEnd
PROPERTY ResponsesEnd
