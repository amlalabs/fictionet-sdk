\* The code as it is, with children whose credit is half a window: the
\* connection holds bytes for the two that never read until the client
\* resets them.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Ids = {1, 3, 5}
  Window = 2
  ChildWindow = 1
  FrameMax = 1
  Body = 2
  H2cBody = 0
  Stalled = {1, 3}
  Resettable = {1, 3}
  SendCredit = 1
  Response = 1
  InitialSend = 1
  MaxWindow = 3
  Increments = {1}
  Initials = {1}
  SplitToCredit = TRUE
  HeldOnlyWindowed = TRUE
  CountHeld = TRUE
  FollowChild = TRUE
  ReleaseOnCredit = TRUE
  ReleaseOnEnd = TRUE
  CheckOverflow = TRUE
  SpendWithinWindows = TRUE
  CountOutBytes = TRUE
  RecordGrant = TRUE
INVARIANT TypeOK
INVARIANT ReleasedOnlyFreed
INVARIANT NothingHeld
INVARIANT SendWindowsBounded
INVARIANT ServerSpendsWithinWindows
INVARIANT ChildWithinGrant
INVARIANT CreditAgrees
PROPERTY BodyReachesChild
PROPERTY RequestsEnd
PROPERTY ResponsesEnd
