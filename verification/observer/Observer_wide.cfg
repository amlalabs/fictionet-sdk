\* The code, wider: four bytes each way, two segments held out of order,
\* payloads of up to two bytes. Invariants only: with EventuallyClosed, TLC
\* had not finished after half an hour; Observer_base checks it.
CONSTANTS
  N = 4
  SegLimit = 2
  MaxLen = 2
  Passive = TRUE
  TrimDelivered = TRUE
  FinInOrder = TRUE
  HolesTruncate = TRUE
  EndOnlyOpen = TRUE
  EvictEnds = TRUE
  FinishCloses = TRUE
  DroppedHoles = TRUE
  ReplacedHoles = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NeverSends
INVARIANT Contiguous
INVARIANT EndOnce
INVARIANT FinIsReached
INVARIANT CutShortIncomplete
INVARIANT ClosedAfterEnds
