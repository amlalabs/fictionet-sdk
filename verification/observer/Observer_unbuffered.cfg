\* The code with out-of-order holding off (Limits::segments zero): every
\* segment ahead of a hole is dropped, with no room for a marker.
CONSTANTS
  N = 3
  SegLimit = 0
  MaxLen = 2
  Passive = TRUE
  TrimDelivered = TRUE
  FinInOrder = TRUE
  HolesTruncate = TRUE
  EndOnlyOpen = TRUE
  EvictEnds = TRUE
  FinishCloses = TRUE
  DroppedHoles = TRUE
  ReplacedHoles = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT NeverSends
INVARIANT Contiguous
INVARIANT EndOnce
INVARIANT FinIsReached
INVARIANT CutShortIncomplete
INVARIANT ClosedAfterEnds
PROPERTY EventuallyClosed
