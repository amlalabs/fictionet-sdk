\* expect violation: Contiguous
\* push delivers an in-order segment whole, without skipping the bytes
\* already delivered: a retransmission repeats them.
CONSTANTS
  N = 3
  SegLimit = 1
  MaxLen = 2
  Passive = TRUE
  TrimDelivered = FALSE
  FinInOrder = TRUE
  HolesTruncate = TRUE
  EndOnlyOpen = TRUE
  EvictEnds = TRUE
  FinishCloses = TRUE
  DroppedHoles = TRUE
  ReplacedHoles = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT Contiguous
