\* The socket as it is, with the Linux look's repeat_syn_ack (extras/src/linux.rs),
\* against the RFC with the named departures.
CONSTANTS
  N = 8
  Cap = 2
  Data = 1
  MaxText = 2
  IRS = 7
  RepeatSynAck = TRUE
  FixUnorderedAck = TRUE
  FixBareFin = TRUE
  FixSynSentFin = TRUE
  FixSecondFin = TRUE
  FixFinBoundsText = TRUE
  FixTimeWaitAck = TRUE
  SpecAckBeforeSeqInSynReceived = TRUE
  SpecChallengeSynInSynReceived = TRUE
  SpecNoAckDroppedFirst = TRUE
  SpecAckCheckedBeforeSeq = TRUE
  SpecRateLimitEmptyOutOfWindow = TRUE
  SpecEmptyAckAtRightEdge = TRUE
  SpecFinAtRightEdge = TRUE
  SpecOpenInTimeWait = TRUE
SPECIFICATION CSpec
INVARIANTS TypeOK NoPanic
PROPERTIES Refines
VIEW View
CHECK_DEADLOCK FALSE
