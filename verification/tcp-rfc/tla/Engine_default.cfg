\* The socket with smoltcp's default settings: a repeated SYN in SYN-RECEIVED is
\* challenged like any other (Engine_base has the Linux look's repeat_syn_ack).
CONSTANTS
  N = 8
  Cap = 2
  Data = 1
  MaxText = 2
  IRS = 7
  RepeatSynAck = FALSE
  FixUnorderedAck = TRUE
  FixBareFin = TRUE
  FixSynSentFin = TRUE
  FixSecondFin = TRUE
  FixFinBoundsText = TRUE
  FixTimeWaitAck = TRUE
  SpecAckBeforeSeqInSynReceived = TRUE
  SpecChallengeSynInSynReceived = TRUE
  SpecNoAckDroppedFirst = TRUE
  SpecAckCheckedBeforeSeq = TRUE
  SpecRateLimitEmptyOutOfWindow = TRUE
  SpecEmptyAckAtRightEdge = TRUE
  SpecFinAtRightEdge = TRUE
  SpecOpenInTimeWait = TRUE
SPECIFICATION CSpec
INVARIANTS TypeOK NoPanic
PROPERTIES Refines
VIEW View
CHECK_DEADLOCK FALSE
