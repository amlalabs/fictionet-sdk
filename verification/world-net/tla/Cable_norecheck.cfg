\* expect violation: WakeIsComing
\* expect violation: WakeAfterPark
\* The receiver returns Pending right after it parks: a packet sent between
\* its look and its park finds the flag down, and the receiver sleeps on it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    MaxQueued = 2
    RecheckAfterPark = FALSE
    DropWakesPeer = TRUE
INVARIANT WakeIsComing
PROPERTY WakeAfterPark
