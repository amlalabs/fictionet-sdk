\* expect violation: Attribution
\* by_addr forgets an address when its sandbox detaches: a packet still on
\* its way from that sandbox is then put down to the route.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Filtered = {f1, f2}
    Routed = {r}
    Addrs = {a1}
    Hosts = {h}
    Outside = {o}
    MaxLife = 2
    None = None
    Host = Host
    OwnByRoutesTo = TRUE
    KeepByAddr = FALSE
INVARIANT Attribution
