\* TLS 1.2: records up to 2^14+2048 from the client, one attacker injection.
SPECIFICATION Spec
CONSTANTS
  V = "1.2"
  Early = "none"
  Allowance = 0
  Frag = FALSE
  Compat = FALSE
  Wide = TRUE
  AppPls = {"F"}
  MaxAppC = 1
  MaxAppS = 1
  MaxKU = 0
  MaxForge = 1
  MaxHs = 0
  MaxBad = 0
  Misbehave = FALSE
  SoftLimit = 100
  ExactCapacity = TRUE
  MarkUnpaidAfterEncrypt = TRUE
  DropAfterLostKeyUpdate = TRUE
  ReserveStep = TRUE
  ReserveBeforeDecrypt = TRUE
  OneRecordPerRead = TRUE
  FailTrialWhenJoining = TRUE
  PlaintextLimit = TRUE
  CcsSizeCheck = TRUE
  CiphertextLimit13 = TRUE
  HeaderBoundInclusive = TRUE
  HeaderOverflowAlert = TRUE
INVARIANTS
  AuthBeforeDeliver
  NonceUnique
  NoGap
  KUOrder
  KUReplyFirst
  NoSendAfterClose
  IgnoreAfterCloseProp
  FatalEnds
  AccLegal
  RightAlert
  NoFalseReject
  HonestWriter
  EncUnique
  HoleMeansFailed
  NothingAfterGap
  RefusalsRetry
  NoWaitingRead
  AtMostOneRecord
  SkipDiscardsSkipped
  TrialChargedOnce
PROPERTIES
  Refines
  RefusalChangesNothing
CHECK_DEADLOCK FALSE
