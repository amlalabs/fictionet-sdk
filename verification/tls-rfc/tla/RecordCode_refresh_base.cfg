\* TLS 1.3 with a record limit of 2 per key: the second write asks for a key update first (maybe_refresh_traffic_keys).
SPECIFICATION Spec
CONSTANTS
  V = "1.3"
  Early = "none"
  Allowance = 0
  Frag = FALSE
  Compat = FALSE
  Wide = FALSE
  AppPls = {"S"}
  MaxAppC = 0
  MaxAppS = 2
  MaxKU = 1
  MaxForge = 0
  MaxHs = 0
  MaxBad = 0
  Misbehave = FALSE
  SoftLimit = 2
  ExactCapacity = TRUE
  MarkUnpaidAfterEncrypt = TRUE
  DropAfterLostKeyUpdate = TRUE
  ReserveStep = TRUE
  ReserveBeforeDecrypt = TRUE
  OneRecordPerRead = TRUE
  FailTrialWhenJoining = TRUE
  PlaintextLimit = TRUE
  CcsSizeCheck = TRUE
  CiphertextLimit13 = TRUE
  HeaderBoundInclusive = TRUE
  HeaderOverflowAlert = TRUE
INVARIANTS
  AuthBeforeDeliver
  NonceUnique
  NoGap
  KUOrder
  KUReplyFirst
  NoSendAfterClose
  IgnoreAfterCloseProp
  FatalEnds
  AccLegal
  RightAlert
  NoFalseReject
  HonestWriter
  EncUnique
  HoleMeansFailed
  NothingAfterGap
  RefusalsRetry
  NoWaitingRead
  AtMostOneRecord
  SkipDiscardsSkipped
  TrialChargedOnce
PROPERTIES
  Refines
  RefusalChangesNothing
CHECK_DEADLOCK FALSE
