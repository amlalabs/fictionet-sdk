\* Documented departure: the client's Finished in two records and a forged record between them, which rustls fails without an alert (trial decryption ends at the first whole message, not the first record that deprotects, RFC 8446 4.2.10). Must violate RightAlert.
SPECIFICATION Spec
CONSTANTS
  V = "1.3"
  Early = "reject"
  Allowance = 1
  Frag = TRUE
  Compat = FALSE
  Wide = FALSE
  AppPls = {"S"}
  MaxAppC = 1
  MaxAppS = 0
  MaxKU = 0
  MaxForge = 1
  MaxHs = 0
  MaxBad = 0
  Misbehave = FALSE
  SoftLimit = 100
  ExactCapacity = TRUE
  MarkUnpaidAfterEncrypt = TRUE
  DropAfterLostKeyUpdate = TRUE
  ReserveStep = TRUE
  ReserveBeforeDecrypt = TRUE
  OneRecordPerRead = TRUE
  FailTrialWhenJoining = TRUE
  PlaintextLimit = TRUE
  CcsSizeCheck = TRUE
  CiphertextLimit13 = TRUE
  HeaderBoundInclusive = TRUE
  HeaderOverflowAlert = TRUE
INVARIANTS
  RightAlert
CHECK_DEADLOCK FALSE
