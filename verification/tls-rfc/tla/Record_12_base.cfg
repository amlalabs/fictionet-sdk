\* TLS 1.2 both ways, records up to 2^14+2048, full-size application data.
SPECIFICATION Spec
CONSTANTS
  V = "1.2"
  Early = "none"
  Allowance = 0
  Frag = FALSE
  Compat = FALSE
  Wide = TRUE
  AppPls = {"F"}
  MaxAppC = 1
  MaxAppS = 1
  MaxKU = 1
  MaxForge = 1
  MaxHs = 0
  MaxBad = 0
  Misbehave = FALSE
  ReplyFirst = TRUE
  CheckSeq = TRUE
  IgnoreAfterClose = TRUE
  QuietAfterClose = TRUE
  CheckSize = TRUE
INVARIANTS
  AuthBeforeDeliver
  NonceUnique
  NoGap
  KUOrder
  KUReplyFirst
  NoSendAfterClose
  IgnoreAfterCloseProp
  FatalEnds
  AccLegal
  RightAlert
  NoFalseReject
  HonestWriter
CHECK_DEADLOCK FALSE
