\* Before dec84f1c2: a TLS 1.2 record of exactly 2^14+2048 is refused.
SPECIFICATION Spec
CONSTANTS
  V = "1.2"
  Early = "none"
  Allowance = 0
  Frag = FALSE
  Compat = FALSE
  Wide = TRUE
  AppPls = {"F"}
  MaxAppC = 1
  MaxAppS = 0
  MaxKU = 0
  MaxForge = 1
  MaxHs = 0
  MaxBad = 1
  Misbehave = TRUE
  SoftLimit = 100
  ExactCapacity = TRUE
  MarkUnpaidAfterEncrypt = TRUE
  DropAfterLostKeyUpdate = TRUE
  ReserveStep = TRUE
  ReserveBeforeDecrypt = TRUE
  OneRecordPerRead = TRUE
  FailTrialWhenJoining = TRUE
  PlaintextLimit = TRUE
  CcsSizeCheck = TRUE
  CiphertextLimit13 = TRUE
  HeaderBoundInclusive = FALSE
  HeaderOverflowAlert = TRUE
INVARIANTS
  NoFalseReject
CHECK_DEADLOCK FALSE
