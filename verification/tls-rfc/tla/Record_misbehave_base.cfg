\* TLS 1.3 with a client that sends one record the RFCs forbid.
SPECIFICATION Spec
CONSTANTS
  V = "1.3"
  Early = "none"
  Allowance = 0
  Frag = FALSE
  Compat = TRUE
  Wide = FALSE
  AppPls = {"S"}
  MaxAppC = 1
  MaxAppS = 1
  MaxKU = 0
  MaxForge = 0
  MaxHs = 0
  MaxBad = 1
  Misbehave = TRUE
  ReplyFirst = TRUE
  CheckSeq = TRUE
  IgnoreAfterClose = TRUE
  QuietAfterClose = TRUE
  CheckSize = TRUE
INVARIANTS
  AuthBeforeDeliver
  NonceUnique
  NoGap
  KUOrder
  KUReplyFirst
  NoSendAfterClose
  IgnoreAfterCloseProp
  FatalEnds
  AccLegal
  RightAlert
  NoFalseReject
  HonestWriter
CHECK_DEADLOCK FALSE
