\* TLS 1.3 with a client that sends one oversize or empty record.
SPECIFICATION Spec
CONSTANTS
  V = "1.3"
  Early = "none"
  Allowance = 0
  Frag = FALSE
  Compat = TRUE
  Wide = FALSE
  AppPls = {"S"}
  MaxAppC = 1
  MaxAppS = 0
  MaxKU = 0
  MaxForge = 1
  MaxHs = 0
  MaxBad = 1
  Misbehave = TRUE
  SoftLimit = 100
  ExactCapacity = TRUE
  MarkUnpaidAfterEncrypt = TRUE
  DropAfterLostKeyUpdate = TRUE
  ReserveStep = TRUE
  ReserveBeforeDecrypt = TRUE
  OneRecordPerRead = TRUE
  FailTrialWhenJoining = TRUE
  PlaintextLimit = TRUE
  CcsSizeCheck = TRUE
  CiphertextLimit13 = TRUE
  HeaderBoundInclusive = TRUE
  HeaderOverflowAlert = TRUE
INVARIANTS
  AuthBeforeDeliver
  NonceUnique
  NoGap
  KUOrder
  KUReplyFirst
  NoSendAfterClose
  IgnoreAfterCloseProp
  FatalEnds
  AccLegal
  RightAlert
  NoFalseReject
  HonestWriter
  EncUnique
  HoleMeansFailed
  NothingAfterGap
  RefusalsRetry
  NoWaitingRead
  AtMostOneRecord
  SkipDiscardsSkipped
  TrialChargedOnce
PROPERTIES
  Refines
  RefusalChangesNothing
CHECK_DEADLOCK FALSE
