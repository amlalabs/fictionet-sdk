\* TLS 1.3 with early data rejected: the server skips one record, the client's Finished in two records, the compatibility change_cipher_spec.
SPECIFICATION Spec
CONSTANTS
  V = "1.3"
  Early = "reject"
  Allowance = 1
  Frag = TRUE
  Compat = FALSE
  Wide = FALSE
  AppPls = {"S"}
  MaxAppC = 1
  MaxAppS = 1
  MaxKU = 0
  MaxForge = 1
  MaxHs = 0
  MaxBad = 0
  Misbehave = FALSE
  ReplyFirst = TRUE
  CheckSeq = TRUE
  IgnoreAfterClose = TRUE
  QuietAfterClose = TRUE
  CheckSize = TRUE
INVARIANTS
  AuthBeforeDeliver
  NonceUnique
  NoGap
  KUOrder
  KUReplyFirst
  NoSendAfterClose
  IgnoreAfterCloseProp
  FatalEnds
  AccLegal
  RightAlert
  NoFalseReject
  HonestWriter
CHECK_DEADLOCK FALSE
