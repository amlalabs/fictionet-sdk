\* An encrypter whose allocations may be larger than it reports: push_paid may refuse after encryption. Refinement is not checked (a dropped alert breaks it, fail-closed); the invariants hold.
SPECIFICATION Spec
CONSTANTS
  V = "1.3"
  Early = "none"
  Allowance = 0
  Frag = FALSE
  Compat = FALSE
  Wide = FALSE
  AppPls = {"S"}
  MaxAppC = 1
  MaxAppS = 1
  MaxKU = 1
  MaxForge = 1
  MaxHs = 0
  MaxBad = 0
  Misbehave = FALSE
  SoftLimit = 100
  ExactCapacity = FALSE
  MarkUnpaidAfterEncrypt = TRUE
  DropAfterLostKeyUpdate = TRUE
  ReserveStep = TRUE
  ReserveBeforeDecrypt = TRUE
  OneRecordPerRead = TRUE
  FailTrialWhenJoining = TRUE
  PlaintextLimit = TRUE
  CcsSizeCheck = TRUE
  CiphertextLimit13 = TRUE
  HeaderBoundInclusive = TRUE
  HeaderOverflowAlert = TRUE
INVARIANTS
  AuthBeforeDeliver
  NonceUnique
  NoGap
  KUOrder
  KUReplyFirst
  NoSendAfterClose
  IgnoreAfterCloseProp
  FatalEnds
  AccLegal
  RightAlert
  NoFalseReject
  HonestWriter
  EncUnique
  HoleMeansFailed
  NothingAfterGap
  RefusalsRetry
  NoWaitingRead
  AtMostOneRecord
  SkipDiscardsSkipped
  TrialChargedOnce
PROPERTIES
  RefusalChangesNothing
CHECK_DEADLOCK FALSE
