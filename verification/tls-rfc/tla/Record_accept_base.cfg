\* TLS 1.3 with early data accepted.
SPECIFICATION Spec
CONSTANTS
  V = "1.3"
  Early = "accept"
  Allowance = 0
  Frag = FALSE
  Compat = TRUE
  Wide = FALSE
  AppPls = {"S"}
  MaxAppC = 1
  MaxAppS = 1
  MaxKU = 0
  MaxForge = 1
  MaxHs = 0
  MaxBad = 0
  Misbehave = FALSE
  ReplyFirst = TRUE
  CheckSeq = TRUE
  IgnoreAfterClose = TRUE
  QuietAfterClose = TRUE
  CheckSize = TRUE
INVARIANTS
  AuthBeforeDeliver
  NonceUnique
  NoGap
  KUOrder
  KUReplyFirst
  NoSendAfterClose
  IgnoreAfterCloseProp
  FatalEnds
  AccLegal
  RightAlert
  NoFalseReject
  HonestWriter
CHECK_DEADLOCK FALSE
