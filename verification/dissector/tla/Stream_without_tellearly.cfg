\* Conversation does not pass on a gap before it chose. Violates StopsAfterGap.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Kind = "stop"
  N = 3
  L = 2
  MaxPkt = 3
  MaxGaps = 1
  StopOnReset = TRUE
  HeadOnly = TRUE
  DropBuffer = TRUE
  TellEarly = FALSE
  ShownPacket = TRUE
  ClearAtEnd = TRUE
  FinFinishes = TRUE
  OthersDiscard = TRUE
  EndAfterChoice = TRUE
INVARIANT StopsAfterGap
