\* HTTP/1: after a gap it reads again from a head.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Kind = "head"
  N = 3
  L = 2
  MaxPkt = 3
  MaxGaps = 1
  StopOnReset = TRUE
  HeadOnly = TRUE
  DropBuffer = TRUE
  TellEarly = TRUE
  ShownPacket = TRUE
  ClearAtEnd = TRUE
  FinFinishes = TRUE
  OthersDiscard = TRUE
  EndAfterChoice = TRUE
INVARIANT ItemsAreMessages
INVARIANT NoJoinAcrossGap
INVARIANT StopsAfterGap
INVARIANT PointsOnlyIntoItsPacket
INVARIANT FinFinishesHeld
INVARIANT OthersDiscardHeld
