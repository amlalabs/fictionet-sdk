\* Dns::reset before its fix: a DNS-over-TCP reader reads on after a gap. Violates ItemsAreMessages.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Kind = "stop"
  N = 3
  L = 2
  MaxPkt = 3
  MaxGaps = 1
  StopOnReset = FALSE
  HeadOnly = TRUE
  DropBuffer = TRUE
  TellEarly = TRUE
  ShownPacket = TRUE
  ClearAtEnd = TRUE
  FinFinishes = TRUE
  OthersDiscard = TRUE
  EndAfterChoice = TRUE
INVARIANT ItemsAreMessages
