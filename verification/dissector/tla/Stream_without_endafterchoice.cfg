\* Conversation::end before its fix: a FIN before the choice never reaches the protocol. Violates FinFinishesHeld.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Kind = "close"
  N = 1
  L = 2
  MaxPkt = 3
  MaxGaps = 0
  StopOnReset = TRUE
  HeadOnly = TRUE
  DropBuffer = TRUE
  TellEarly = TRUE
  ShownPacket = TRUE
  ClearAtEnd = TRUE
  FinFinishes = TRUE
  OthersDiscard = TRUE
  EndAfterChoice = FALSE
INVARIANT FinFinishesHeld
