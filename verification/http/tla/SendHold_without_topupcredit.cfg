\* Must violate QueueWithinCredit: a frame tops up granted credit without subtracting queued bytes.
SPECIFICATION Spec
CONSTANTS
    Ids = {1, 3}
    SendCredit = 2
    ReceiveWindow = 2
    MaxWindow = 1
    Frame = 1
    BodyUnits = 2
    ReceiveUnits = 1
    WriteTimeout = 1
    TimeLimit = 2
    StallDeadline = TRUE
    TopUpCredit = FALSE
    ReturnCreditWhenFreed = TRUE
INVARIANTS
    QueuePaid
    QueueWithinCredit
    ReceivePaid
    ReceiveWithinWindow
    QueuesTrack
    ReceiveTracks
    HoldBounded
CHECK_DEADLOCK FALSE
