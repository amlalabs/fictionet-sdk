\* expect violation: GoneReleases
\* A transport that keeps what Hold gave it after the connection is gone
\* never lets the count go: the peer stays at its limit for good.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Conns = {c1, c2, c3}
    Max = 2
    MayBlock = TRUE
    Retry = TRUE
    AdmitFirst = TRUE
    ChildOwnsGuard = FALSE
    ReleaseOnGone = FALSE
PROPERTY GoneReleases
