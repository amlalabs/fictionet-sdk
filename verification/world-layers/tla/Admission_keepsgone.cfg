\* expect violation: NotHeldWhenGone
\* A transport that keeps what Hold gave it after the connection is gone
\* breaks the boundary the host relies on.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Conns = {c1, c2, c3}
    Max = 2
    MayBlock = TRUE
    Retry = TRUE
    AdmitFirst = TRUE
    ChildOwnsGuard = FALSE
    ReleaseOnGone = FALSE
INVARIANT NotHeldWhenGone
