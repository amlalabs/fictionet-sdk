\* expect violation: FactoriesOnlyOnServedPorts
\* A factory attached when its port is bound is on a port the machine does
\* not serve yet.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    V4 = V4
    V6 = V6
    Ports = {p1, p2}
    MaxDecls = 2
    MaxInstalls = 2
    Joins = FALSE
    PublishEarly = FALSE
    StartEarly = FALSE
    AttachEarly = TRUE
    KeepOnFailure = FALSE
    BuildAgain = FALSE
INVARIANT FactoriesOnlyOnServedPorts
