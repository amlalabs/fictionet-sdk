\* expect violation: CountedUntilGone
\* The count is tied to the application child: closing a finished
\* application releases its guard while the transport is still closing.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Conns = {c1, c2, c3}
    Max = 2
    MayBlock = TRUE
    Retry = TRUE
    AdmitFirst = TRUE
    ChildOwnsGuard = TRUE
    ReleaseOnGone = TRUE
INVARIANT CountedUntilGone
