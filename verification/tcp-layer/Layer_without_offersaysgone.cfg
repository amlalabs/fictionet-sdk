\* expect violation: GoneIsSaid
\* offer opens a child for a connection the peer reset while it waited in
\* the backlog without TcpNotice::Gone, as before this commit: the child
\* is gone from the start, and the host hears of it only once it closes
\* the child.
CONSTANTS
  Accepted = {a1}
  Connected = {k1}
  Backlog = 1
  MaxGrants = 1
  ReleaseOpen = TRUE
  GoneGuards = TRUE
  StopReleases = TRUE
  ClearOrphanTimer = TRUE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
  OfferReady = TRUE
  BoundBacklog = TRUE
  SayGone = TRUE
  OfferSaysGone = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT GoneIsSaid
