\* expect violation: SaidMeansReleased
\* Hold guarded by `retired` alone, as before 773c5c1a3: a Hold for a
\* connection whose Gone already went up is kept, so a host that counts by
\* Gone and the layer disagree.  TLC's shortest case is a Hold after the
\* stop; a Hold after the peer's RST is the same.
CONSTANTS
  Accepted = {a1}
  Connected = {k1}
  Backlog = 1
  MaxGrants = 1
  ReleaseOpen = TRUE
  GoneGuards = FALSE
  StopReleases = TRUE
  ClearOrphanTimer = TRUE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
  OfferReady = TRUE
  BoundBacklog = TRUE
  SayGone = TRUE
  OfferSaysGone = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT SaidMeansReleased
