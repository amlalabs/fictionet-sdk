\* The code: every rule in place.  One connection from a peer to a
\* listener with a backlog of one, one connection out, one Accept.
CONSTANTS
  Accepted = {a1}
  Connected = {k1}
  Backlog = 1
  MaxGrants = 1
  ReleaseOpen = TRUE
  GoneGuards = TRUE
  StopReleases = TRUE
  ClearOrphanTimer = TRUE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
  OfferReady = TRUE
  BoundBacklog = TRUE
  SayGone = TRUE
  OfferSaysGone = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ChildAfterHandshake
INVARIANT OpenedWithinAccepts
INVARIANT BacklogBound
INVARIANT BytesAfterHandshake
INVARIANT HeldOnlyUntilGone
INVARIANT CountedUntilGone
INVARIANT SaidMeansReleased
INVARIANT GoneIsSaid
INVARIANT StopHoldsNothing
INVARIANT NoTimerWhenGone
PROPERTY ReleaseSaid
PROPERTY AbortAfterGoneIsNothing
PROPERTY GoneWhateverTheChild
