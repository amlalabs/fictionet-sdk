\* expect violation: GoneWhateverTheChild
\* No Release, as before 773c5c1a3: an open child in TIME-WAIT or timed
\* out keeps what it held for as long as the host keeps the child.
CONSTANTS
  Accepted = {a1}
  Connected = {k1}
  Backlog = 1
  MaxGrants = 1
  ReleaseOpen = FALSE
  GoneGuards = TRUE
  StopReleases = TRUE
  ClearOrphanTimer = TRUE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
  OfferReady = TRUE
  BoundBacklog = TRUE
  SayGone = TRUE
  OfferSaysGone = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
PROPERTY GoneWhateverTheChild
