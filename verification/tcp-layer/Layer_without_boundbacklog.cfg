\* expect violation: BacklogBound
\* A SYN starts a connection however many wait: two finished handshakes
\* wait for accept on a listener with a backlog of one.
CONSTANTS
  Accepted = {a1, a2}
  Connected = {}
  Backlog = 1
  MaxGrants = 2
  ReleaseOpen = TRUE
  GoneGuards = TRUE
  StopReleases = TRUE
  ClearOrphanTimer = TRUE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
  OfferReady = TRUE
  BoundBacklog = FALSE
  SayGone = TRUE
  OfferSaysGone = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT BacklogBound
