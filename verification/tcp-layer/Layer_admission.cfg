\* The code, for admission: two connections from peers to a listener
\* with a backlog of one, and two Accepts.  No connection out.
CONSTANTS
  Accepted = {a1, a2}
  Connected = {}
  Backlog = 1
  MaxGrants = 2
  ReleaseOpen = TRUE
  GoneGuards = TRUE
  StopReleases = TRUE
  ClearOrphanTimer = TRUE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT ChildAfterHandshake
INVARIANT OpenedWithinAccepts
INVARIANT BacklogBound
INVARIANT BytesAfterHandshake
INVARIANT HeldOnlyUntilGone
INVARIANT CountedUntilGone
INVARIANT SaidMeansReleased
INVARIANT StopHoldsNothing
INVARIANT NoTimerWhenGone
PROPERTY ReleaseSaid
PROPERTY AbortAfterGoneIsNothing
PROPERTY GoneWhateverTheChild
