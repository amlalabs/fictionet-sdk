\* expect violation: AbortAfterGoneIsNothing
\* Abort guarded by `retired` alone, as before 773c5c1a3: Abort on a
\* connection that is already gone still resets it.  TLC's shortest case
\* is an Abort after the stop; an open child in TIME-WAIT is the same.
CONSTANTS
  Accepted = {a1}
  Connected = {k1}
  Backlog = 1
  MaxGrants = 1
  ReleaseOpen = TRUE
  GoneGuards = FALSE
  StopReleases = TRUE
  ClearOrphanTimer = TRUE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
  OfferReady = TRUE
  BoundBacklog = TRUE
  SayGone = TRUE
  OfferSaysGone = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
PROPERTY AbortAfterGoneIsNothing
