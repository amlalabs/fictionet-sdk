  MaxGrants = 1
  ReleaseOpen = TRUE
  GoneGuards = FALSE
  StopReleases = TRUE
  ClearOrphanTimer = TRUE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
