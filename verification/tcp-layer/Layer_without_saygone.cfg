  Accepted = {a1}
  Connected = {k1}
  Backlog = 1
  MaxGrants = 1
  ReleaseOpen = TRUE
  GoneGuards = TRUE
  StopReleases = TRUE
  ClearOrphanTimer = TRUE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
  OfferReady = TRUE
  BoundBacklog = TRUE
  SayGone = FALSE
  OfferSaysGone = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
PROPERTY ReleaseSaid
