\* expect violation: NoTimerWhenGone
\* expire_orphans without its (false, _) arm: an orphan that leaves
\* FIN-WAIT-2 for TIME-WAIT retires with its orphan timer armed.
CONSTANTS
  Accepted = {a1}
  Connected = {k1}
  Backlog = 1
  MaxGrants = 1
  ReleaseOpen = TRUE
  GoneGuards = TRUE
  StopReleases = TRUE
  ClearOrphanTimer = FALSE
  CountAccepts = TRUE
  LiveAfterHandshake = TRUE
  CountUntilGone = TRUE
  ResetReleases = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTimerWhenGone
