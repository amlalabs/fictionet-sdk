# Fictionet's TCP stack over whole IPv4 and IPv6 packets.
# Forked from smoltcp 0.14.0 under 0BSD; see LICENSE-0BSD.txt.
[package]
name = "smoltcp"
version = "0.14.0"
edition = "2024"
rust-version.workspace = true
description = "Fictionet's fork of smoltcp, the TCP/IP stack used by Fictionet."
license = "0BSD"
publish = false
autoexamples = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
managed = { version = "0.8", default-features = false, features = ["std"] }
byteorder = { version = "1.0", default-features = false }

[dev-dependencies]
# Randomized segment assembler tests.
rand = "0.8"
