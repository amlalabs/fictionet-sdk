# Fictionet's TCP stack over whole IPv4 and IPv6 packets.
# Forked from smoltcp 0.14.0 under 0BSD; see LICENSE-0BSD.txt.
[package]
name = "smoltcp"
version = "0.14.0"
edition = "2024"
rust-version.workspace = true
description = "Fictionet's fork of smoltcp, the TCP/IP stack used by Fictionet."
license = "0BSD"
publish = false
autoexamples = false

[lints.rust]
# Denied, not forbidden, so that the counting allocator of the resource
# properties, compiled only into tests and proofs, can allow it.
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)', 'cfg(kani)'] }

[dependencies]
byteorder = { version = "1.0", default-features = false }
fictionet-buf = { path = "../buf" }

[dev-dependencies]
managed = { version = "0.8", default-features = false, features = ["std"] }
# Randomized segment assembler tests.
rand = "0.8"
