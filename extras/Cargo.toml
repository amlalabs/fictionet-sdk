[package]
name = "fictionet-extras"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Optional web layouts and reusable service components for Fictionet worlds."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
brotli = "8"
bytes = "1"
fictionet = { path = "..", features = ["web-proxy"] }
fictionet-host = { path = "../host" }
flate2 = "1"
httparse = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
include_dir = "0.7"
kuchiki = "0.8"
percent-encoding = "2"
redb = "4.4"
ring = "0.17"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tower-service = "0.3"
url = "2"
zstd = "0.13"

[dev-dependencies]
fictionet-observe = { path = "../observe", features = ["native"] }
