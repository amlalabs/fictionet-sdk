[package]
name = "fictionet-extras"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Optional web layouts and reusable service components for Fictionet worlds."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
fictionet = { path = "..", default-features = false }
hyper = "1"
bytes = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fictionet = { path = "..", features = ["web-proxy", "tokio"] }
axum = { version = "0.8", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
xz2 = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
quick-xml = { version = "0.42", features = ["escape-html"] }
brotli = "8"
fictionet-host = { path = "../host" }
flate2 = "1"
httparse = "1"
html5ever = "0.40"
http-body = "1"
http-body-util = "0.1"
include_dir = "0.7"
kuchiki = "0.8"
percent-encoding = "2"
redb = "4.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "macros", "io-util"] }
time = "0.3"
tower-service = "0.3"
url = "2"
zstd = "0.13"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
