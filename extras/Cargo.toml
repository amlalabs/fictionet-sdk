[package]
name = "fictionet-extras"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Optional web layouts and reusable service components for Fictionet worlds."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
bytes = "1"
fictionet = { path = "..", features = ["web-proxy"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
include_dir = "0.7"
kuchiki = "0.8"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tower-service = "0.3"
url = "2"

[dev-dependencies]
fictionet-observe = { path = "../observe", features = ["native"] }
