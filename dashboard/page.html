<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fictionet</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/page.css">
  <script type="importmap" nonce="PAGE_NONCE">{"imports":{"three":"/vendor/three/build/three.module.js"}}</script>
  <script type="module" src="/page.mjs"></script>
</head>
<body>
<div id="demo" data-state="loading">
  <header class="top-bar">
    <div class="wordmark">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="wm-bg" width="32" height="32" rx="7"/><path class="wm-fg-line" d="M9 22 16 10l7 12"/><circle class="wm-fg" cx="9" cy="22" r="2.6"/><circle class="wm-fg" cx="23" cy="22" r="2.6"/><rect class="wm-accent" x="13.4" y="7.4" width="5.2" height="5.2"/></svg>
      Fictionet
    </div>
    <h1 id="page-title"></h1>
    <div class="run-status" id="run-status" data-state="connecting" role="status">
      <i class="dot" aria-hidden="true"></i><span id="page-status">Connecting</span><time id="run-clock"></time>
    </div>
    <button id="moment-banner" class="moment-banner" type="button" hidden><b id="moment-title"></b><span id="moment-time"></span></button>
    <span class="grow"></span>
    <button class="icon-button" id="theme" type="button" aria-label="Switch theme">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
    </button>
  </header>
  <nav id="host-bar" aria-label="Hosts"><span class="skeleton-chip"></span><span class="skeleton-chip"></span></nav>
  <main id="workbench">
    <div id="workspace" aria-label="Workspace"></div>
    <div id="divider" role="separator" aria-label="Resize the workspace" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="80" aria-valuenow="58" tabindex="0"></div>
    <aside id="inspector" aria-label="Inspector">
      <div class="tab-strip"><div id="tabs" role="tablist" aria-label="Inspector panels"></div></div>
      <div id="scope"><span id="scope-text">Showing all hosts</span><button id="clear-scope" class="text-button" type="button" hidden>Show all hosts</button><span id="moment-status" role="status"></span></div>
      <section id="inspector-content" role="tabpanel" tabindex="0"><div class="loading-line" aria-label="Loading"></div></section>
    </aside>
    <div id="notice" class="notice" hidden><div class="card" role="alert"><h2 id="notice-title"></h2><p id="notice-text"></p><button id="notice-action" class="button" type="button" hidden>Reload</button></div></div>
  </main>
  <footer><span>Fictionet by Amla Labs</span><a href="/vendor/licenses">Licenses</a></footer>
</div>
</body>
</html>
