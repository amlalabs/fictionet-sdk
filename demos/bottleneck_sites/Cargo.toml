[package]
name = "fictionet-bottleneck-sites-demo"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false

[[bin]]
name = "bottleneck_sites"
path = "main.rs"

[dependencies]
fictionet = { path = "../..", features = ["web-proxy", "tokio"] }
axum = { version = "0.8", default-features = false, features = ["ws"] }
fictionet-observe = { path = "../../observe", features = ["native"] }
