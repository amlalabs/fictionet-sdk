[package]
name = "nuclear-world"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "A deterministic educational two-loop pressurized water reactor world."

[lib]
path = "src/lib.rs"

[dependencies]
fictionet = { path = "../../..", features = ["page"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
http = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }

# The viewer and integration tests serve the control room page.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"

[dev-dependencies]
fictionet-test-support = { path = "../../../tests/support" }
http-body-util = "0.1"
tower-service = "0.3"

[lints.rust]
unsafe_code = "forbid"
# `cargo kani` builds with `--cfg kani`, which adds the proofs in `verification/`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
