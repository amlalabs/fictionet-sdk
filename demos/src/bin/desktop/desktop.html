<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fictionet desktop</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2;
    --fg: #1d1d1b;
    --muted: #55544f;
    --line: #cfcdc6;
    --accent: #a63d14;
    --screen: #1d1d1b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --fg: #ecebe7;
      --muted: #aaa8a1;
      --line: #3a3934;
      --accent: #f08a5d;
      --screen: #000;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 system-ui, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #status { color: var(--muted); }
  #control {
    margin-left: auto;
    min-height: 32px;
    padding: 4px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--fg);
    font: inherit;
    cursor: pointer;
  }
  #control[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #control:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #screen { flex: 1; min-height: 0; background: var(--screen); }
  footer { padding: 4px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  footer a { color: inherit; }
  @media (forced-colors: active) {
    #control[aria-pressed="true"] { border-color: Highlight; color: Highlight; }
  }
</style>
</head>
<body>
<header>
  <h1>Fictionet desktop</h1>
  <span id="status" role="status">Connecting</span>
  <button id="control" type="button" aria-pressed="false">Watching: take control</button>
</header>
<main id="screen" aria-label="The guest's screen"></main>
<footer>
  The guest's screen, over VNC through its agent. Its network is a Fictionet world.
  Viewer: <a href="novnc/README.md">noVNC 1.7.0</a>, under the
  <a href="novnc/LICENSE.txt">MPL-2.0 and other licenses</a>.
</footer>
<script type="module">
import RFB from './novnc/core/rfb.js';

const screen = document.getElementById('screen');
const status = document.getElementById('status');
const control = document.getElementById('control');
let rfb = null;
let controlling = false;

function show(state, text) {
  document.body.dataset.state = state;
  status.textContent = text;
}

function setControl(on) {
  controlling = on;
  control.setAttribute('aria-pressed', String(on));
  control.textContent = on ? 'Controlling: back to watching' : 'Watching: take control';
  if (rfb) {
    rfb.viewOnly = !on;
    if (on) rfb.focus();
  }
}

function connect() {
  show('connecting', 'Connecting');
  rfb = new RFB(screen, `ws://${location.host}/websockify`, {
    shared: true,
    wsProtocols: ['binary'],
  });
  rfb.scaleViewport = true;
  rfb.viewOnly = !controlling;
  rfb.addEventListener('connect', () => show('connected', 'Connected'));
  rfb.addEventListener('disconnect', () => {
    rfb = null;
    show('disconnected', 'Not connected; retrying');
    setTimeout(connect, 2000);
  });
}

control.addEventListener('click', () => setControl(!controlling));
connect();
</script>
</body>
</html>
