<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search · Fictionet</title>
<link rel="preload" href="/fonts/terminal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/search.mjs"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><strong>Fictionet</strong><span class="slash">/</span><span>Search</span></div>
  <div id="source" class="mode-switch" role="group" aria-label="Page source">
    <button data-source="copied" aria-pressed="false">Copied</button>
    <button data-source="live" aria-pressed="false">Live</button>
    <button data-source="edited" aria-pressed="false">Edited</button>
  </div>
  <div class="toolbar"><span id="scenario-state" class="scenario-state" role="status" hidden></span><button id="agent-toggle" aria-pressed="true">Hide agent</button><span class="run-clock"><span id="clock">00:00:00</span> UTC</span><button id="world-toggle" aria-expanded="false" aria-controls="world-menu">World settings</button></div>
</header>
<main>
  <section id="agent" class="agent panel" aria-label="Workstation">
    <div class="windowbar"><span>workstation</span><div class="segments"><button id="terminal-tab" aria-pressed="true">Terminal</button><button id="screen-tab" aria-pressed="false">Screen</button></div></div>
    <div id="console-status" role="status">Starting the workstation…</div>
    <div id="terminal" class="console"></div><div id="screen" class="console off"></div>
  </section>
  <section id="world" class="world panel" aria-label="Search network">
      <div class="map-wrap"><div id="map" aria-label="VM, world services and internet"></div></div>
      <div id="activity" class="activity" aria-label="Recent activity"></div>
    <aside id="details" hidden aria-label="Details"><div class="detail-heading"><div><h1 id="detail-title"></h1><p id="detail-subtitle"></p></div><button id="close-details" aria-label="Close details">×</button></div><div id="detail-body"></div><div id="detail-actions"></div></aside>
  </section>
</main>
<div id="world-menu" class="world-menu" hidden><h2>World</h2><p id="world-date"></p><form id="scenario-form"><div class="scenario-label"><label for="scenario">Scenario</label><span id="scenario-readiness" class="scenario-state" hidden></span></div><textarea id="scenario" rows="3" placeholder="The Fed raised rates by 0.5 points on Oct 22"></textarea><div class="scenario-actions"><button type="submit" id="scenario-set">Set</button><button type="button" id="scenario-clear">Clear</button></div></form><button id="restart">Restart pages</button><p id="world-error" role="alert"></p></div>
<div id="notice" role="status" hidden></div>
</body>
</html>
