[package]
name = "fictionet-search-demo"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "A Search world, Ubuntu workstation and owned observation page."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
fictionet = { path = "../../..", features = ["web-proxy", "tokio", "page"] }
fictionet-demo = { path = "../../kit" }
fictionet-extras = { path = "../../../extras" }
web-world = { path = "../world" }
http = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
url = "2"

[[bin]]
name = "search"
path = "src/main.rs"
