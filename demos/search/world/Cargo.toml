[package]
name = "web-world"
version = "0.0.0"
edition = "2024"
description = "A web world with copied captures, model-written pages and one search index."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
fictionet-extras = { path = "../../../extras" }
fictionet-host = { path = "../../../host" }
bytes = "1"
fictionet = { path = "../../..", features = ["web-proxy"] }
http = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
percent-encoding = "2"
http-body-util = "0.1"
form_urlencoded = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", default-features = false, features = ["sync", "rt-multi-thread", "net", "time", "macros"] }
url = "2"
tower-service = "0.3"
kuchiki = "0.8"
zim = "0.5"
rayon = "1"

[dev-dependencies]
flate2 = "1"
http-body = "1"
fictionet-test-support = { path = "../../../tests/support" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

# This acceptance test requires the downloaded security corpus.
[[test]]
name = "corpus"
test = false

[[test]]
name = "packages"
test = false
