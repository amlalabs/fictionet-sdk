[package]
name = "web-world"
version = "0.0.0"
edition = "2024"
description = "A web world with copied captures, live pages, and pages edited for a scenario."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
fictionet-extras = { path = "../../../extras" }
fictionet-host = { path = "../../../host", features = ["filesystem"] }
bytes = "1"
fictionet = { path = "../../..", features = ["web-proxy"] }
http = "1"
libc = "0.2"
percent-encoding = "2"
http-body-util = "0.1"
form_urlencoded = "1"
regex = "1"
unicode-normalization = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", default-features = false, features = ["sync", "rt-multi-thread", "net", "time", "macros"] }
url = "2"
tower-service = "0.3"
kuchiki = "0.8"
zim = "0.5"
rayon = "1"
pdf-extract = "0.12.1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
fictionet-test-support = { path = "../../../tests/support" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `cargo kani` builds with `--cfg kani`, which adds the proofs in `verification/`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
