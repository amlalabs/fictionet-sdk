# Border on Fictionet, lab setting, under Docker Compose: cargo xtask demo border
# runs it in the VM, and the README says how to run it by hand.
#
#   world     - the world: web::Sites and the border routers, in Rust. No
#               network at all (network_mode: none). Its only door is the
#               world socket on the `sock` volume, at /run/relay/relay.sock.
#               The agent can see that path in /proc/net/unix (Unix sockets
#               are listed per network namespace), so it names nothing.
#   attach    - fictionet attach --type tun: makes tun0 in its own network
#               namespace and relays its packets to the world socket.
#   default   - the agent. It joins attach's network namespace, so its only
#               interface is tun0. It drops NET_RAW, cannot gain privileges,
#               and cannot reach the world socket.
#
# The variant and the task are interpolated from sample metadata
# (SAMPLE_METADATA_VARIANT, SAMPLE_METADATA_TASK), which Inspect only does
# when the sandbox config is a file path. The world refuses to start
# without a valid variant.

name: fictionet-border

x-build: &build
  context: ../..
  dockerfile: demos/border/docker/Dockerfile

services:
  world:
    build:
      <<: *build
      target: world
    image: fictionet-border-world:dev
    init: true                      # passes SIGTERM on to the world
    network_mode: none
    # The world is trusted. NET_ADMIN lets it raise its socket buffers to
    # attach past the system limit, so a burst of packets is not lost.
    cap_add: [NET_ADMIN]
    command: ["border-world", '{"variant":"${SAMPLE_METADATA_VARIANT:-}","task":"${SAMPLE_METADATA_TASK:-read}"}' , "--subnet", "10.0.0.0/24"]
    volumes:
      - sock:/run/relay
    healthcheck:
      test: ["CMD", "test", "-f", "/run/fictionet/ready"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  attach:
    build:
      <<: *build
      target: attach
    image: fictionet-border-attach:dev
    command:
      - fictionet
      - attach
      - --world
      - unix:/run/relay/relay.sock
      - --name
      - agent
      - --type
      - tun
      - --ip-addr
      - 10.0.0.2/24
      - --gateway
      - 10.0.0.1
      - --dns
      - 10.0.0.1
      - --no-ip-addr-v6
      - --no-gateway-v6
      - --no-dns-v6
      - --ready-file
      - /run/attach-ready
    network_mode: none
    cap_add: [NET_ADMIN]
    # The agent shares this network namespace. IPv4 only, as in the original study.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.lo.disable_ipv6: "1"
    devices:
      - /dev/net/tun
    volumes:
      - sock:/run/relay
    depends_on:
      world:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/run/attach-ready"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  default:
    build:
      <<: *build
      target: agent
    image: fictionet-border-agent:dev
    network_mode: "service:attach"
    # As in the original study: no raw sockets, and no gaining privileges.
    cap_drop: [NET_RAW]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      attach:
        condition: service_healthy
    init: true

volumes:
  sock:
