[package]
name = "honeypot-world"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "A Linux server with an MPTCP listener that logs everyone who tries it."

[lib]
path = "src/lib.rs"

[[bin]]
name = "honeypot"
path = "src/main.rs"

[dependencies]
fictionet-extras = { path = "../../extras" }
fictionet = { path = "../.." }
fictionet-host = { path = "../../host", default-features = false, features = ["virtio-net"], optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[features]
raw-virtio = ["dep:fictionet-host"]

[[example]]
name = "raw_honeypot"
required-features = ["raw-virtio"]
