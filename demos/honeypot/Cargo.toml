[package]
name = "honeypot-world"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "One Linux honeypot with MPTCP, SSH, and port-zero evidence."

[lib]
path = "src/lib.rs"

[[bin]]
name = "honeypot"
path = "src/main.rs"

[dependencies]
fictionet-extras = { path = "../../extras" }
fictionet = { path = "../.." }
fictionet-host = { path = "../../host", default-features = false, features = ["tun"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "signal", "net", "io-util", "macros"] }
libc = "0.2"

[features]
default = ["raw-virtio"]
raw-ethernet = ["fictionet-host/raw-ethernet"]
raw-virtio = ["raw-ethernet", "fictionet-host/virtio-net"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
