[package]
name = "fictionet-h2spec-world-demo"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false

[[bin]]
name = "h2spec_world"
path = "main.rs"

[dependencies]
fictionet = { path = "../..", features = ["web-proxy", "tokio"] }
bytes = "1"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
