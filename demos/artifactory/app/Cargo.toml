[package]
name = "fictionet-artifactory-demo"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Shared microVM kit and demos: Ubuntu's official cloud image in an embedded Cloud Hypervisor, networked by a world in the same process."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
artifactory-world = { path = "../world" }
fictionet-demo = { path = "../../kit" }
fictionet = { path = "../../..", features = ["web-proxy", "page"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "ws"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync", "signal"] }
http = "1.5.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[dev-dependencies]
fictionet-host = { path = "../../../host" }
bytes = "1"
http-body-util = "0.1"

[[bin]]
name = "artifactory"
path = "src/main.rs"
