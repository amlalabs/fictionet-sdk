[package]
name = "fictionet-demo"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Fictionet's demos as one program: the world in the process, the sandbox in an embedded microVM."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
example-common = { path = "../examples/common" }
fictionet = { path = ".." }
fictionet-microvm = { path = "../microvm" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }

# The cloud-image demo's VMM-agnostic parts: a cloud-init NoCloud seed and a
# per-run disk overlay written in Rust, and an embedded SSH client. These
# prepare and reach an unmodified distro image whatever hypervisor boots it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
russh = "0.54"

[[bin]]
name = "cloudimage"
path = "src/bin/cloudimage/main.rs"
