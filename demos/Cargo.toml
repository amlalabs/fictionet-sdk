[package]
name = "fictionet-demo"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Shared microVM kit and demos: Ubuntu's official cloud image in an embedded Cloud Hypervisor, networked by a world in the same process."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
border-world = { path = "../examples/border/world" }
fictionet-observe = { path = "../observe", features = ["page"] }
example-common = { path = "../examples/common" }
# `tokio` hands the jump host's TCP connection to the SSH client.
fictionet = { path = "..", features = ["web-proxy", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "fs", "process", "sync", "signal"] }
bytes = "1"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1"
httpdate = "1"
tower-service = "0.3.3"
# Parses the Chrome DevTools Protocol replies the desktop demo drives Chromium
# with to screenshot the noVNC viewer.
serde_json = "1"
# Encode the guest screen the viewer capture reads over RFB as a PNG: deflate
# and CRC from vetted crates, chunk framing in the demo.
flate2 = "1"
crc32fast = "1"

# The shared kit's image and SSH support: a cloud-init NoCloud seed and a
# per-run disk overlay written in Rust, and an embedded SSH client. These
# prepare and reach an unmodified distro image whatever hypervisor boots it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
russh = "0.54"
libc = "0.2"
# The vhost-user-net backend that joins Cloud Hypervisor's guest to the
# world. Versions track vhost-user-backend 0.18's own, so the virtio-queue,
# vm-memory and vhost types are one instance across the crates.
vhost = { version = "0.14", features = ["vhost-user-backend"] }
vhost-user-backend = "0.18"
virtio-queue = "0.14"
vm-memory = { version = "0.16.2", features = ["backend-mmap", "backend-atomic"] }
vmm-sys-util = "0.14"

[[bin]]
name = "desktop"
path = "src/bin/desktop/main.rs"

[[bin]]
name = "border"
path = "src/bin/border/main.rs"
