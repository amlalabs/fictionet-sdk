# Added to examples/adaptive-web/compose.yaml by cargo xtask demo adaptive-web. It
# builds the same images from the same Dockerfile, with one change: the
# stage that compiles adaptive-web-world and fictionet is replaced by the
# static binaries that vm/guest/build.sh already built, in
# /opt/fictionet/prebuilt. A build context with a stage's name takes that
# stage's place.
services:
  world:
    build:
      additional_contexts:
        build: /opt/fictionet/prebuilt
  attach:
    build:
      additional_contexts:
        build: /opt/fictionet/prebuilt
