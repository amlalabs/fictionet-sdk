# Added to examples/border/compose.yaml by cargo xtask demo border. It builds the same
# images from the same Dockerfile, with one change: the stage that compiles
# border-world and fictionet is replaced by the static binaries that
# vm/guest/build.sh already built, in /opt/fictionet/prebuilt. A build
# context with a stage's name takes that stage's place.
services:
  world:
    build:
      additional_contexts:
        build: /opt/fictionet/prebuilt
  attach:
    build:
      additional_contexts:
        build: /opt/fictionet/prebuilt
  default:
    build:
      additional_contexts:
        build: /opt/fictionet/prebuilt
