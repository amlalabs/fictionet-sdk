[package]
name = "fictionet-route-change-demo"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false

[[bin]]
name = "route_change"
path = "main.rs"

[dependencies]
fictionet = { path = "../..", features = ["web-proxy", "tokio"] }
bytes = "1"
http = "1"
fictionet-observe = { path = "../../observe", features = ["native"] }

[dev-dependencies]
fictionet-test-support = { path = "../../tests/support" }
