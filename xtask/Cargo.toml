[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
fictionet-demo = { path = "../demos/kit" }
fictionet-extras = { path = "../extras" }
http = "1"
web-world = { path = "../demos/search/world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "signal"] }

fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }

[dev-dependencies]
fictionet = { path = ".." }
