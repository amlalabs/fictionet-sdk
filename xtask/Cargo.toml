[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
default-run = "xtask"

[features]
host-tools = [
    "dep:fictionet", "dep:fictionet-demo", "dep:fictionet-extras", "dep:fictionet-host",
    "dep:http", "dep:web-world", "dep:serde", "dep:serde_json", "dep:url",
    "dep:tokio", "dep:fatfs", "dep:reqwest", "dep:zim", "dep:zip", "dep:mime_guess",
    "dep:tar", "dep:xz2",
]
shibboleth = ["dep:honeypot-world", "dep:serde_json"]

[dependencies]
honeypot-world = { path = "../demos/honeypot", optional = true }
fictionet = { path = "..", optional = true }
fictionet-demo = { path = "../demos/kit", optional = true }
fictionet-extras = { path = "../extras", optional = true }
fictionet-host = { path = "../host", features = ["filesystem"], optional = true }
http = { version = "1", optional = true }
web-world = { path = "../demos/search/world", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["raw_value"], optional = true }
url = { version = "2", features = ["serde"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "signal", "net", "fs", "sync"], optional = true }

fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"], optional = true }
zim = { version = "0.5", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
mime_guess = { version = "2", optional = true }
tar = { version = "0.4", optional = true }
xz2 = { version = "0.1", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
