[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
libc = "0.2"
regex = "1"
serde_json = "1"

fictionet-codegen = { path = "../codegen" }
fictionet-test-support = { path = "../tests/support" }
fictionet = { path = "..", features = ["web-proxy", "tokio"] }
