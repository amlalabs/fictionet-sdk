[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
fictionet = { path = ".." }
fictionet-demo = { path = "../demos/kit" }
fictionet-extras = { path = "../extras" }
http = "1"
libc = "0.2"
web-world = { path = "../demos/search/world" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
url = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "signal", "net", "fs", "sync"] }

fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
