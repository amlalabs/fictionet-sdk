name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer run cancels an older run of the same kind on the same ref.
# Pushes and nightly runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Build host integration with observation; the simulated core alone;
        # all features including outbound web proxying; and tokio without observation.
        include:
          - name: default features
            features: ""
          - name: no default features
            features: "--no-default-features"
          - name: all features
            features: "--all-features"
          - name: tokio without observation
            features: "--no-default-features --features tokio"
    steps:
      - uses: actions/checkout@v4
      # The toolchain pinned in rust-toolchain.toml, with clippy.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo build --locked --workspace --all-targets ${{ matrix.features }}
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        run: cargo nextest run --locked --workspace ${{ matrix.features }}
      - name: Doctests
        run: cargo test --locked --doc --workspace ${{ matrix.features }}
      - name: Docs
        run: cargo doc --locked --workspace --no-deps ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets ${{ matrix.features }} -- -D warnings

  # Every crate in the repository is formatted with the default rustfmt
  # style (rustfmt.toml). From the crate root, so rust-toolchain.toml there
  # picks the toolchain for all of them.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: |
          for manifest in Cargo.toml fuzz/Cargo.toml tests/copy_and_own/Cargo.toml \
              examples/wasm_world/Cargo.toml examples/border/world/Cargo.toml \
              examples/fakewiki/world/Cargo.toml examples/adaptive-web/world/Cargo.toml \
              examples/artifactory/world/Cargo.toml; do
            cargo fmt --all --check --manifest-path "$manifest"
          done

  # Tests for worlds outside the workspace, including Border, FakeWiki,
  # Artifactory and adaptive web, plus adaptive web's offline backend.
  # Also test the browser example on the host and in Node.js, Border's
  # and Artifactory's evals, and the Inspect package. Check the fuzz crate
  # on the pinned stable toolchain with the cfg that cargo fuzz sets.
  examples:
    name: examples, Python and the fuzz crate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain, with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/border/world
            examples/fakewiki/world
            examples/adaptive-web/world
            examples/artifactory/world
            examples/wasm_world
            fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: astral-sh/setup-uv@v6
      - name: Border's world
        run: cargo test --locked --manifest-path examples/border/world/Cargo.toml
      - name: FakeWiki's world
        run: cargo test --locked --manifest-path examples/fakewiki/world/Cargo.toml
      - name: Artifactory's world
        run: cargo test --locked --manifest-path examples/artifactory/world/Cargo.toml
      - name: The adaptive web's world
        run: cargo test --locked --manifest-path examples/adaptive-web/world/Cargo.toml
      - name: Example log readers
        run: python3 -m unittest discover -s examples/common -p test_logs.py
      - name: The adaptive web's backend
        working-directory: examples/adaptive-web/world/backend
        run: python3 -m unittest discover tests
      - name: The browser example, on the host
        run: cargo test --locked --manifest-path examples/wasm_world/Cargo.toml
      - name: The browser example, in Node.js
        working-directory: examples/wasm_world
        run: wasm-pack test --node -- --locked
      - name: Border's eval
        working-directory: examples/border
        run: uv run --locked pytest
      - name: Artifactory's eval
        working-directory: examples/artifactory
        run: uv run --locked pytest
      - name: The Inspect package
        working-directory: python/inspect_fictionet
        run: uv run --locked --extra k8s pytest
      # From the crate root, so rust-toolchain.toml there, not fuzz/'s
      # nightly, picks the toolchain.
      - name: The fuzz crate on stable
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
        env:
          RUSTFLAGS: --cfg fuzzing

  # Bulk TCP through the copied module must keep pace with the built-in one.
  copy-tcp:
    name: copied TCP performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Compare TCP implementations in release
        run: cargo bench --locked -p fictionet-copy-modules --bench tcp

  wasm:
    name: wasm32 (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain, with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # ring's C code builds with clang, which on the runner has the wasm32 target.
      - name: Check
        run: cargo check --locked --lib --no-default-features --target wasm32-unknown-unknown
      - name: Clippy
        run: cargo clippy --locked --lib --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: Check the browser example
        run: cargo check --locked --all-targets --manifest-path examples/wasm_world/Cargo.toml --target wasm32-unknown-unknown

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      # +1.91 overrides rust-toolchain.toml.
      - name: Check
        run: cargo +1.91 check --locked --workspace --all-targets

  fuzz:
    name: fuzz (build; 60 s per target nightly)
    runs-on: ubuntu-latest
    # Scheduled and manual runs allow for about 135 targets at 60 s each
    # and the build. Other runs allow 45 minutes for the build and checks.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 200 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Every target has a [[bin]] and a corpus directory
        run: fuzz/check-targets.sh
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # +nightly overrides the stable toolchain pinned in rust-toolchain.toml.
      - name: Build the targets
        run: cargo +nightly fuzz build -O -a
      # Runs every target, even after one fails, and fails at the end if any did.
      - name: Run each target for 60 seconds
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: fuzz/run-all.sh 60 -timeout=20 -rss_limit_mb=4096
      - name: Keep what a target found
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  docker:
    name: docker (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each Dockerfile and the stages to build from it, from the crate
        # root, as its compose file or script does. "-" is the last stage.
        include:
          - dockerfile: deploy/Dockerfile
            targets: attach web-world agent
          - dockerfile: tests/docker/web/Dockerfile
            targets: runtime agent
          - dockerfile: tests/docker/ping/Dockerfile
            targets: runtime agent
          - dockerfile: tests/docker/proxy/Dockerfile
            targets: runtime agent
          - dockerfile: tests/docker/tcpudp/Dockerfile
            targets: "-"
          - dockerfile: examples/scan/docker/Dockerfile
            targets: fictionet container scanner
          - dockerfile: examples/fakewiki/docker/Dockerfile
            targets: world attach agent
          - dockerfile: examples/adaptive-web/docker/Dockerfile
            targets: world attach agent
          - dockerfile: examples/artifactory/docker/Dockerfile
            targets: world attach agent
          - dockerfile: examples/border/docker/Dockerfile
            targets: world world-home attach agent home
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          for t in ${{ matrix.targets }}; do
            echo "::group::$t"
            if [ "$t" = - ]; then target=(); else target=(--target "$t"); fi
            docker buildx build -f "${{ matrix.dockerfile }}" "${target[@]}" .
            echo "::endgroup::"
          done

  docker-test:
    name: docker test (${{ matrix.test }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test: [tcpudp, web, ping]
    steps:
      - uses: actions/checkout@v4
      - run: tests/docker/${{ matrix.test }}/run.sh
