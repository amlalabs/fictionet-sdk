name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check formatting in the fuzz workspace
        run: cargo fmt --all --check --manifest-path fuzz/Cargo.toml

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The worlds enable web-proxy, so build them in the all-features run.
        # The CLI turns on the SDK's tokio feature, which is not a default,
        # so the runs with and without the default features name the
        # packages they cover and leave the CLI out. The CLI has its own run.
        include:
          - name: default features
            args: -p fictionet -p fictionet-codegen -p fictionet-codegen-golden -p fictionet-codegen-layouts -p xtask
          - name: no default features
            args: -p fictionet -p fictionet-codegen -p fictionet-codegen-golden -p fictionet-codegen-layouts --no-default-features
          - name: the command
            args: -p fictionet-cli
          - name: all features
            args: --workspace --all-features
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Download the pinned browser libraries
        if: matrix.args == '--workspace --all-features'
        run: cargo xtask demo libraries
      - name: Build tests, examples and benchmarks
        run: cargo test --locked --all-targets --no-run ${{ matrix.args }}
      - name: Use the runner's Chrome for the dashboard regression
        run: echo "CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Test
        run: cargo nextest run --locked ${{ matrix.args }}
      - name: Doctests
        run: cargo test --locked --doc ${{ matrix.args }}

  clippy-docs:
    name: clippy and docs (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: -p fictionet -p fictionet-codegen -p fictionet-codegen-golden -p fictionet-codegen-layouts -p xtask
          - name: no default features
            args: -p fictionet -p fictionet-codegen -p fictionet-codegen-golden -p fictionet-codegen-layouts --no-default-features
          - name: the command
            args: -p fictionet-cli
          - name: all features
            args: --workspace --all-features
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets --test host ${{ matrix.args }} -- -D warnings
      - name: Docs
        run: cargo doc --locked --no-deps ${{ matrix.args }}
        env:
          RUSTDOCFLAGS: -D warnings
      - name: The fuzz crate on nightly
        if: matrix.args == '--workspace --all-features'
        working-directory: fuzz
        run: |
          rustup toolchain install
          cargo check --locked --bins
        env:
          RUSTFLAGS: --cfg fuzzing
      - name: Fuzz helper regressions
        if: matrix.args == '--workspace --all-features'
        run: cargo test --locked --manifest-path fuzz/Cargo.toml --lib
        env:
          RUSTFLAGS: --cfg fuzzing
      - name: The stdlib copied into a crate of its own
        if: matrix.args == '--workspace --all-features'
        run: cargo xtask copy-check

  host:
    name: host (${{ matrix.test || matrix.dockerfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: namespaces
          - test: tcpudp
          - test: web
          - test: ping
          - test: proxy
          - test: h2spec
          - dockerfile: deploy/Dockerfile
            targets: attach web-world agent
          - dockerfile: tests/docker/proxy/Dockerfile
            targets: runtime agent
          - dockerfile: examples/scan/docker/Dockerfile
            targets: fictionet container scanner
          - dockerfile: examples/fakewiki/docker/Dockerfile
            targets: world attach agent
          - dockerfile: examples/adaptive-web/docker/Dockerfile
            targets: world attach agent
          - dockerfile: examples/artifactory/docker/Dockerfile
            targets: world attach agent
          - dockerfile: examples/border/docker/Dockerfile
            targets: world world-home attach agent home
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v3
      - uses: taiki-e/install-action@v2
        if: matrix.test == 'namespaces'
        with:
          tool: cargo-nextest
      - name: Allow unprivileged user namespaces
        if: matrix.test == 'namespaces'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The tun tests run as root in the tcpudp container.
      - name: Test attach in user namespaces
        if: matrix.test == 'namespaces'
        run: |
          cargo nextest run --locked -p fictionet-cli --test host attach_bin::
          cargo nextest run --locked -p fictionet-cli --test host --all-features attach_bin::
      - name: Docker tests
        if: matrix.test != '' && matrix.test != 'namespaces' && matrix.test != 'h2spec'
        run: cargo xtask docker ${{ matrix.test }}
      - name: HTTP/2 conformance
        if: matrix.test == 'h2spec'
        run: cargo xtask h2spec
      - name: Build images
        if: matrix.dockerfile != ''
        run: |
          for target in ${{ matrix.targets }}; do
            docker buildx build -f "${{ matrix.dockerfile }}" --target "$target" .
          done

  python:
    name: Python packages and world backends
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: azure/setup-helm@v4.3.0
      - name: Inspect package, world scorers and hosted packaging
        run: >-
          uv run --project python/inspect_fictionet --locked --extra k8s
          --no-editable --reinstall-package inspect-fictionet pytest
          python/inspect_fictionet/tests
          examples/hosted/tests
          tests/k8s
      - name: FakeWiki's backend
        working-directory: examples/fakewiki/world/backend
        run: uv run --project "${{ github.workspace }}/python/inspect_fictionet" --locked --extra k8s --no-editable python -m pytest tests
      - name: The adaptive web's backend
        working-directory: examples/adaptive-web/world/backend
        run: uv run --project "${{ github.workspace }}/python/inspect_fictionet" --locked --extra k8s --no-editable python -m pytest tests

  wasm:
    name: wasm32 (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain, with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Check
        run: cargo check --locked --lib --no-default-features --target wasm32-unknown-unknown -p fictionet
      - name: Check the tokio adapters
        run: cargo check --locked --lib --no-default-features --features tokio --target wasm32-unknown-unknown -p fictionet
      - name: Clippy
        run: cargo clippy --locked --lib --no-default-features --target wasm32-unknown-unknown -p fictionet -- -D warnings
      - name: Check the browser example
        run: cargo check --locked --all-targets -p wasm-world --target wasm32-unknown-unknown
      - name: The browser example, in Node.js
        working-directory: examples/wasm_world
        run: wasm-pack test --node -- --locked
