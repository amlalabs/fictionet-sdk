name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            features: ""
          - name: no default features
            features: "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      # The toolchain pinned in rust-toolchain.toml, with clippy.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo build --locked --all-targets ${{ matrix.features }}
      - name: Test
        run: cargo nextest run --locked --workspace ${{ matrix.features }}
      - name: Doctests
        run: cargo test --locked --doc --workspace ${{ matrix.features }}
      - name: Docs
        run: cargo doc --locked --no-deps ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings

  wasm:
    name: wasm32 (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain, with the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # ring's C code builds with clang, which on the runner has the wasm32 target.
      - name: Check
        run: cargo check --locked --lib --no-default-features --target wasm32-unknown-unknown
      - name: Clippy
        run: cargo clippy --locked --lib --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: Check the browser example
        run: cargo check --locked --all-targets --manifest-path examples/wasm_world/Cargo.toml --target wasm32-unknown-unknown

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      # +1.91 overrides rust-toolchain.toml.
      - name: Check
        run: cargo +1.91 check --locked --workspace --all-targets

  fuzz:
    name: fuzz (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # +nightly overrides the stable toolchain pinned in rust-toolchain.toml.
      - name: Build the targets
        run: cargo +nightly fuzz build -O -a
      - name: Run each target for 60 seconds
        run: |
          for t in $(cargo +nightly fuzz list); do
            echo "::group::$t"
            cargo +nightly fuzz run -O -a "$t" "fuzz/corpus/$t" -- -max_total_time=60 -timeout=20 -rss_limit_mb=4096
            echo "::endgroup::"
          done
      - name: Keep what a target found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
