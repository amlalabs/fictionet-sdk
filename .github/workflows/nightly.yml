name: Nightly integration

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v4.3.0
      - uses: azure/setup-kubectl@v4
      - run: cargo xtask k8s

  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage
      - name: Allow KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        with:
          path: |
            .vm/debian-*.qcow2
            .vm/prepared-*.qcow2
          key: integration-vm-${{ runner.os }}-${{ hashFiles('xtask/src/vm.rs', 'xtask/src/vm/tap.rs') }}
      - run: cargo xtask vm --fetch
