[workspace]
members = [".", "codegen", "codegen/tests/layouts"]
exclude = ["fuzz"]
resolver = "3"

[package]
name = "fictionet"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A simulated internet for AI agent evals and RL environments."
license = "MIT OR Apache-2.0"
repository = "https://github.com/amlalabs/fictionet-sdk"
homepage = "https://fictionet.com"
readme = "README.md"
keywords = ["network", "simulation", "sandbox", "agents", "testing"]
categories = ["network-programming", "simulation", "development-tools::testing"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "tokio", "observe"]
observe = ["std"]
std = ["dep:libc", "dep:http", "dep:http-body", "dep:tower-service"]
tokio = ["std", "dep:tokio", "dep:hyper", "dep:h2"]
web-proxy = ["tokio", "dep:hyper-util", "dep:hyper-rustls", "hyper/client"]

[[bin]]
name = "fictionet"
path = "src/bin/fictionet/main.rs"
required-features = ["std"]

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`, which adds `fictionet::fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
bytes = "1"
h2 = { version = "0.4", optional = true }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
http = { version = "1.5.0", optional = true }
http-body = { version = "1.1.0", optional = true }
hyper = { version = "1.11.1", optional = true, default-features = false, features = ["http1", "http2", "server"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", optional = true, default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
rand_chacha = "0.9.0"
ring = "0.17"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa"] }
p384 = { version = "0.13.1", features = ["ecdh", "ecdsa"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-reno", "async"] }
tokio = { version = "1", optional = true, default-features = false, features = ["io-util"] }
tower-service = { version = "0.3.3", optional = true }

# The host side: real sockets, threads, the relay, the listener and the CLI.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = { version = "0.2.189", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "net", "time", "sync"] }

# The browser (wasm32-unknown-unknown): random bytes and the clocks come
# from JavaScript through wasm-bindgen, and timers from setTimeout. ring's
# feature turns on getrandom 0.2's browser backend. getrandom 0.4 is the one
# Fictionet and hickory-proto (through rand) use. rustls-pki-types reads the
# time of day for certificates from web-time. ring's C code builds with a
# clang that has the wasm32 target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
web-time = "1"

[dev-dependencies]
http-body-util = "0.1"
fictionet-codegen = { path = "codegen" }
fictionet-copy-modules = { path = "tests/copy_and_own" }
axum = { version = "0.8", default-features = false, features = ["ws"] }
hyper = { version = "1.11.1", features = ["client"] }
etherparse = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Example targets. `cargo test` also runs those marked with `test = true`.
[[example]]
name = "web_world"
required-features = ["std"]
test = false

# The web test world adds bulk transfers and a real upstream.
[[example]]
name = "web_fixture"
path = "tests/web_fixture/world.rs"
required-features = ["web-proxy"]
test = true

[[example]]
name = "scan"
path = "examples/scan/main.rs"
test = true
required-features = ["std"]

[[example]]
name = "custom_protocol"
path = "examples/custom_protocol/main.rs"
test = true
required-features = ["std"]

# The performance suite: `cargo bench --bench perf`. See CONTRIBUTING.md.
[[bench]]
name = "perf"
harness = false
required-features = ["std", "tokio", "observe"]

# Dependencies are built optimized once and then cached; ring, rustls and
# tokio are much faster that way, and debug builds of the crate itself are
# unchanged.
[profile.dev.package."*"]
opt-level = 2

# The tests run the protocol code through randomized and large inputs, which
# runs about five times faster at opt-level 1. Line tables keep file and line
# numbers in backtraces and make the test binaries quicker to link.
[profile.test]
debug = "line-tables-only"
opt-level = 1

