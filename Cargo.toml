[workspace]
members = [
    ".",
    "cli",
    "extras",
    "host",
    "codegen",
    "codegen/tests/golden",
    "codegen/tests/layouts",
    "demos/kit",
    "demos/artifactory/app",
    "demos/artifactory/world",
    "demos/search/app",
    "demos/search/world",
    "demos/nuclear/world",
    "smoltcp",
    "xtask",
]
default-members = [".", "cli", "codegen", "codegen/tests/golden", "codegen/tests/layouts", "xtask"]
exclude = ["fuzz"]
resolver = "3"

# The SDK and the command share one version, which `fictionet --version`
# prints and the release tag must match.
[workspace.package]
version = "0.1.0"
# The pinned toolchain in rust-toolchain.toml: the only Rust the SDK is
# built and tested with.
rust-version = "1.99"

[package]
name = "fictionet"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "A simulated internet for AI agent evals and RL environments."
license = "MIT OR Apache-2.0"
repository = "https://github.com/amlalabs/fictionet-sdk"
homepage = "https://fictionet.com"
readme = "README.md"
keywords = ["network", "simulation", "sandbox", "agents", "testing"]
categories = ["network-programming", "simulation", "development-tools::testing"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
tokio = ["dep:tokio"]
web-proxy = []
page = ["tokio", "dep:axum", "dep:serde", "dep:tokio-stream"]

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`, which adds `fictionet::fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", optional = true, features = ["derive"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
bytes = "1"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
http = { version = "1.5.0" }
http-body = { version = "1.1.0" }
rand_chacha = "0.10.0"
ring = "0.17"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
p384 = { version = "0.14", features = ["ecdh", "ecdsa"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
smoltcp = { path = "smoltcp", default-features = false }
tokio = { version = "1", optional = true, default-features = false, features = ["io-util"] }
tower-service = { version = "0.3.3" }

# The host side: real sockets, threads, the relay and the listener.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = { version = "0.2.189" }

# The browser (wasm32-unknown-unknown): random bytes and the clocks come
# from JavaScript through wasm-bindgen, and timers from setTimeout. ring's
# feature turns on getrandom 0.2's browser backend. getrandom 0.4 is the one
# Fictionet and hickory-proto (through rand) use. rustls-pki-types reads the
# time of day for certificates from web-time. ring's C code builds with a
# clang that has the wasm32 target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
web-time = "1"

[dev-dependencies]
bytes = "1"
http = "1"
fictionet-host = { path = "host", default-features = false }
h2 = "0.4"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
fictionet-codegen = { path = "codegen" }
fictionet-codegen-golden = { path = "codegen/tests/golden" }
fictionet-test-support = { path = "tests/support" }
axum = { version = "0.8", default-features = false, features = ["ws"] }
hyper = { version = "1.11.1", features = ["client", "http1", "http2", "server"] }
etherparse = "0.21"
fictionet-extras = { path = "extras" }
libc = "0.2.189"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
divan = "0.1.21"

# The web test fixture adds bulk transfers and a real upstream.
[[example]]
name = "web_fixture"
path = "tests/web_fixture/world.rs"
required-features = ["web-proxy", "tokio"]
test = true

[[bench]]
name = "network"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "decoders"
harness = false

# Dependencies are built optimized once and then cached; ring, rustls and
# tokio are much faster that way, and debug builds of the crate itself are
# unchanged.
[profile.dev.package."*"]
opt-level = 2

# The tests run the protocol code through randomized and large inputs, which
# runs about five times faster at opt-level 1. Line tables keep file and line
# numbers in backtraces and make the test binaries quicker to link.
[profile.test]
debug = "line-tables-only"
opt-level = 1

[profile.release.package.web-world]
debug = 1

[profile.release.package.artifactory-world]
debug = 1

[profile.release.package.nuclear-world]
debug = 1

# Tests that need user namespaces, root or a tun device run when named.
[[test]]
name = "host"
test = false

# h2spec downloads its binary from GitHub, so it runs when named.
[[test]]
name = "h2spec"
test = false
required-features = ["web-proxy", "tokio"]
