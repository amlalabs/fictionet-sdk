{{- if not .Values.services }}
{{- fail "fictionet-sandbox: give at least one entry under services" }}
{{- end }}
{{- range $name, $given := .Values.services }}
{{- $svc := mergeOverwrite (deepCopy $.Values.serviceDefaults) (deepCopy $given) }}
{{- $attach := mergeOverwrite (deepCopy $.Values.attach) (deepCopy (default dict $svc.attach)) }}
{{- $world := $svc.world }}
{{- /* A service's own resources, and its world's, replace the defaults whole, so a limit can be left out. */}}
{{- $g := default dict $given }}
{{- $resources := $svc.resources }}
{{- if hasKey $g "resources" }}{{ $resources = $g.resources }}{{ end }}
{{- $worldResources := $world.resources }}
{{- if and (kindIs "map" $g.world) (hasKey (default dict $g.world) "resources") }}{{ $worldResources = $g.world.resources }}{{ end }}
{{- $dns := list }}
{{- with $attach.dns }}{{ $dns = append $dns . }}{{ end }}
{{- with $attach.dnsV6 }}{{ $dns = append $dns . }}{{ end }}
{{- if not $dns }}
{{- fail (printf "fictionet-sandbox: service %s needs attach.dns or attach.dnsV6: the pod's only nameserver is the world" $name) }}
{{- end }}
{{- if not (has $attach.type (list "tun" "http_proxy" "socks5")) }}
{{- fail (printf "fictionet-sandbox: service %s: attach.type must be tun, http_proxy or socks5, not %v" $name $attach.type) }}
{{- end }}
{{- $proxy := ne $attach.type "tun" }}
{{- $secret := include "fictionet.tokenSecret" (dict "root" $ "service" $name) }}
{{- if $proxy }}
{{- /* The sandbox's proxy token. Kept across upgrades, so a running agent's token stays valid. */}}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $secret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "fictionet.labels" $ | nindent 4 }}
    inspect/service: {{ $name }}
  annotations:
    {{- toYaml $.Values.annotations | nindent 4 }}
type: Opaque
data:
  token: {{ if and $existing $existing.data }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "fictionet.fullname" $ }}-{{ $name }}
  labels:
    {{- include "fictionet.labels" $ | nindent 4 }}
    inspect/service: {{ $name }}
  annotations:
    {{- toYaml $.Values.annotations | nindent 4 }}
spec:
  serviceName: ""
  replicas: 1
  selector:
    matchLabels:
      {{- include "fictionet.selectorLabels" $ | nindent 6 }}
      inspect/service: {{ $name }}
  template:
    metadata:
      labels:
        {{- with (include "fictionet.labelsFromValues" $ | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "fictionet.selectorLabels" $ | nindent 8 }}
        inspect/service: {{ $name }}
      annotations:
        {{- with $.Values.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Under gVisor, share the socket's emptyDir between the world and
        # attach. Without these, each container sees its own empty copy.
        # Other runtimes ignore them. The node's containerd must pass
        # dev.gvisor.* pod annotations to runsc (pod_annotations).
        dev.gvisor.spec.mount.relay.share: pod
        dev.gvisor.spec.mount.relay.type: tmpfs
        dev.gvisor.spec.mount.relay.options: rw
    spec:
      {{- with $.Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      automountServiceAccountToken: {{ $.Values.automountServiceAccountToken }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      # The agent must not see the processes of attach or the world.
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 2
      # The world answers DNS. No cluster DNS and no search domains. With
      # a proxy type, attach looks names up in the world, and the pod's
      # resolver is 127.0.0.1, where nothing listens: a program that looks
      # a name up itself fails at once, rather than waiting on a server
      # the NetworkPolicy blocks.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          {{- if $proxy }}
          - 127.0.0.1
          {{- else }}
          {{- toYaml $dns | nindent 10 }}
          {{- end }}
        searches: []
        options:
          - name: ndots
            value: "1"
      # Native sidecars: started in this order, before the agent, and kept
      # running beside it. The agent starts once attach's startup probe
      # passes, and with a proxy type once wait-blocked has exited 0.
      initContainers:
        - name: world
          restartPolicy: Always
          image: {{ required (printf "services.%s.world.image is required" $name) $world.image | quote }}
          {{- with $world.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with $world.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $world.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $world.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $worldResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $world.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: relay
              mountPath: /run/relay
            {{- range $svc.shared }}
            - name: shared-{{ .name }}
              mountPath: {{ .mountPath | quote }}
            {{- end }}
        - name: attach
          restartPolicy: Always
          image: {{ required "attach.image is required" $attach.image | quote }}
          {{- with $attach.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          args:
            {{- include "fictionet.attachArgs" (dict "attach" $attach "service" $name) | nindent 12 }}
          startupProbe:
            {{- include "fictionet.readyProbe" $ | nindent 12 }}
            periodSeconds: 1
            failureThreshold: {{ add (int $attach.worldWait) 30 }}
          readinessProbe:
            {{- include "fictionet.readyProbe" $ | nindent 12 }}
            periodSeconds: 5
          {{- with $attach.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $proxy }}
          # A proxy type needs no privileges: it runs as the world's user,
          # so it may open the world's socket, with no capabilities.
          securityContext:
            runAsUser: {{ int $attach.runAsUser }}
            runAsGroup: {{ int $attach.runAsUser }}
            runAsNonRoot: {{ ne (int $attach.runAsUser) 0 }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          {{- else }}
          # Root in its own container, with two capabilities: NET_ADMIN for
          # tun0, routes and eth0, and MKNOD to make /dev/net/tun. And
          # DAC_OVERRIDE to connect to a socket the world's user owns.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, MKNOD, DAC_OVERRIDE]
            seccompProfile:
              type: RuntimeDefault
          {{- end }}
          volumeMounts:
            - name: relay
              mountPath: /run/relay
            {{- if $proxy }}
            - name: token
              mountPath: /run/relay-token
              readOnly: true
            {{- end }}
        {{- if and $proxy $.Values.networkPolicy.waitForEnforcement }}
        # A proxy type leaves eth0 up, and the NetworkPolicy is what keeps
        # the agent off it. A CNI may enforce a new policy some time after
        # the pod starts. This regular init container exits 0 only once a
        # direct TCP connection from the pod to the API server, and to each
        # of networkPolicy.waitAddresses, has failed 3 times in a row, so
        # the agent's container starts only after that.
        - name: wait-blocked
          image: {{ $attach.image | quote }}
          {{- with $attach.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          args:
            - wait-blocked
            - --api-server
            - --timeout
            - {{ int $.Values.networkPolicy.waitTimeout | quote }}
            {{- range $.Values.networkPolicy.waitAddresses }}
            - {{ . | quote }}
            {{- end }}
          resources:
            limits:
              memory: 32Mi
              cpu: 100m
          securityContext:
            runAsUser: {{ int $attach.runAsUser }}
            runAsGroup: {{ int $attach.runAsUser }}
            runAsNonRoot: {{ ne (int $attach.runAsUser) 0 }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
        {{- end }}
      containers:
        # The agent's container. It is first, so it is the one Inspect
        # runs commands in.
        - name: {{ $name }}
          image: {{ required (printf "services.%s.image is required" $name) $svc.image | quote }}
          {{- with $svc.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with $svc.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.workingDir }}
          workingDir: {{ . | quote }}
          {{- end }}
          {{- $env := list }}
          {{- if $proxy }}
          {{- /* The proxy variables, with the token from the Secret. */}}
          {{- $port := include "fictionet.proxyPort" $attach }}
          {{- $env = append $env (dict "name" "RELAY_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" $secret "key" "token"))) }}
          {{- if eq $attach.type "http_proxy" }}
          {{- $url := printf "http://relay:$(RELAY_TOKEN)@127.0.0.1:%s" $port }}
          {{- range list "HTTP_PROXY" "http_proxy" "HTTPS_PROXY" "https_proxy" }}
          {{- $env = append $env (dict "name" . "value" $url) }}
          {{- end }}
          {{- $env = append $env (dict "name" "NODE_USE_ENV_PROXY" "value" "1") }}
          {{- else }}
          {{- $url := printf "socks5h://relay:$(RELAY_TOKEN)@127.0.0.1:%s" $port }}
          {{- range list "ALL_PROXY" "all_proxy" }}
          {{- $env = append $env (dict "name" . "value" $url) }}
          {{- end }}
          {{- end }}
          {{- range list "NO_PROXY" "no_proxy" }}
          {{- $env = append $env (dict "name" . "value" "") }}
          {{- end }}
          {{- end }}
          {{- $env = concat $env (default list $svc.env) }}
          {{- with $env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $svc.shared $svc.volumeMounts }}
          volumeMounts:
            {{- range $svc.shared }}
            - name: shared-{{ .name }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with $svc.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      volumes:
        # The world's socket and attach's ready file. Never mounted in the
        # agent's container.
        - name: relay
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if $proxy }}
        # The sandbox's proxy token, for attach. The agent gets it in its
        # proxy variables instead.
        - name: token
          secret:
            secretName: {{ $secret }}
            defaultMode: 0444
        {{- end }}
        {{- range $svc.shared }}
        - name: shared-{{ .name }}
          emptyDir: {}
        {{- end }}
        {{- with $svc.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
