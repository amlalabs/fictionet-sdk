[[bin]]
name = "tls"
path = "fuzz_targets/tls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stack"
path = "fuzz_targets/stack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp"
path = "fuzz_targets/tcp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "web"
