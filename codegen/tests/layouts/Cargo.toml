# The random layouts of codegen/tests/layout.rs, generated by build.rs and
# compiled against the SDK through a path dependency. `cargo test` runs the
# tests that the generator writes into each module.
[package]
name = "fictionet-codegen-layouts"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
path = "lib.rs"
doctest = false
doc = false

[dependencies]
# No default features, as codegen's own dev-dependency.
fictionet = { path = "../../..", default-features = false }

[build-dependencies]
fictionet-codegen = { path = "../.." }
