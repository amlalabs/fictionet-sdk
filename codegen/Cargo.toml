[package]
name = "fictionet-codegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Bounded Fictionet protocol generation"
license = "MIT OR Apache-2.0"

[dev-dependencies]
# No default features, so `--workspace --no-default-features` builds
# fictionet without host integration or runtime adapters.
fictionet = { path = "..", default-features = false }

[lints.rust]
missing_docs = "deny"
