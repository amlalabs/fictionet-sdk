[package]
name = "fictionet-host"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Host HTTP and DNS transports for Fictionet worlds."
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[features]
filesystem = ["dep:libc"]
default = ["proxy"]
proxy = ["fictionet/web-proxy"]
raw-ethernet = []
virtio-net = ["dep:libc", "raw-ethernet"]
tun = ["dep:libc", "tokio/macros"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fictionet = { path = "..", default-features = false }
bytes = "1"
http = "1"
http-body = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
tower-service = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "io-util"] }
tokio-util = { version = "0.7", default-features = false }
hickory-net = { version = "0.26.3", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
fictionet-extras = { path = "../extras" }
fictionet-test-support = { path = "../tests/support" }
libc = "0.2"
futures-util = { version = "0.3", default-features = false }

[[example]]
name = "raw_world"
required-features = ["virtio-net"]
