[package]
name = "fictionet-host"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Host HTTP transport for Fictionet proxies."
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["proxy"]
proxy = ["fictionet/web-proxy"]

[dependencies]
fictionet = { path = "..", default-features = false }
bytes = "1"
http = "1"
http-body = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
fictionet-test-support = { path = "../tests/support" }
http-body-util = "0.1"
tower-service = "0.3"
tokio = { version = "1", features = ["sync"] }
