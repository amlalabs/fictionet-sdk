[package]
name = "fictionet-quic-interop"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false

[lib]
path = "lib.rs"
doctest = false

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fictionet = { path = "../.." }
fictionet-extras = { path = "../../extras" }
quinn-proto = { package = "fictionet-quinn-proto", path = "../../quinn-proto", default-features = false, features = ["rustls-ring"] }
rustls = { package = "fictionet-rustls", path = "../../rustls", default-features = false, features = ["std", "ring"] }
ring = "0.17"
quiche = "=0.30.1"
tempfile = "3"
http = "1"
fictionet-test-support = { path = "../support" }
