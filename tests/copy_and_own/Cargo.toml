[package]
name = "fictionet-copy-modules"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "modules.rs"
test = false
doctest = false
doc = false

[dependencies]
bytes = "1"
fictionet = { path = "../..", default-features = false }
h2 = "0.4"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1"
httparse = "1.10"
hyper = { version = "1.11.1", default-features = false, features = ["http1", "http2", "server"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tower-service = "0.3.3"
