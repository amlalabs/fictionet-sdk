[package]
name = "fictionet-copy-modules"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "modules.rs"
test = false
doctest = false
doc = false

[[bench]]
name = "tcp"
harness = false

[[bin]]
name = "fictionet-copy-stdlib"
path = "stdlib.rs"
test = false
doc = false

# ip.rs checks its reassembly's bookkeeping under `cargo fuzz`, which
# builds with `--cfg fuzzing`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
bytes = "1"
fictionet = { path = "../..", default-features = false }
h2 = "0.4"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
http = "1.5.0"
http-body = "1.1.0"
hyper = { version = "1.11.1", default-features = false, features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "tokio"] }
ring = "0.17"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa"] }
p384 = { version = "0.13.1", features = ["ecdh", "ecdsa"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-reno", "async"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "io-util", "sync"] }
tower-service = "0.3.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2.189"

# The web module's doc examples serve axum routers, as the README's does.
[dev-dependencies]
axum = { version = "0.8", default-features = false }
