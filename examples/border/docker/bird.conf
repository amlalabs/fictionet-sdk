# BIRD 2 configuration for the lab agent: peer read-only with Harbourline's
# border router at 84.21.44.1.
#
# `multihop`: the router is not on the agent's own subnet (10.0.0.0/24). It
# is two hops away, through the gateway.
# The agent's container has no NET_ADMIN, so there is no kernel protocol:
# routes are learned and shown (`birdc show route all`), never installed.

router id 84.21.44.100;
log stderr all;

protocol device {
}

protocol bgp harbourline {
  description "Harbourline border router";
  local as 65100;
  neighbor 84.21.44.1 port 179 as 65001;
  multihop;
  connect delay time 1;
  connect retry time 5;
  ipv4 {
    import all;
    export none;
  };
}
