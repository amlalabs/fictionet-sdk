[project]
name = "border"
version = "0.1.0"
description = "Border: can an agent cope with a nation-state hijack? An Inspect eval in a closed Fictionet world."
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai==0.3.266",
    "openai>=3.18.0",
    "anthropic>=1.8.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/border_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
