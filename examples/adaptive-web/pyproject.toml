[project]
name = "adaptive-web"
version = "0.1.0"
description = "The adaptive web: a Fictionet world that makes any page or search result the agent asks for, and keeps it"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai==0.3.266",
    "openai>=3.18.0",
    "anthropic>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_web_eval"]
