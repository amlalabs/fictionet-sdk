# The adaptive web on Fictionet under Docker Compose, which cargo xtask demo
# adaptive-web runs in the VM.
#
#   world     - the world: web::Sites in Rust for any name, which makes and
#               keeps the pages. Offline (the default) it has no network at
#               all. Live, it needs a network to reach the model API, and
#               only it has one.
#   attach    - fictionet attach --type tun: makes tun0 in its own network
#               namespace and relays its packets to the world socket.
#   default   - the agent. It joins attach's network namespace, so its only
#               interface is tun0. It has no extra capabilities and does not
#               see the world socket.
#
# World options use command arguments. Provider API keys use the environment.

name: fictionet-adaptive-web

x-build: &build
  context: ../..
  dockerfile: examples/adaptive-web/docker/Dockerfile

services:
  world:
    build:
      <<: *build
      target: world
    image: fictionet-adaptive-web-world:dev
    init: true                      # passes SIGTERM on to the world
    network_mode: none
    # The world is trusted. NET_ADMIN lets it raise its socket buffers to
    # attach past the system limit, so a burst of packets is not lost.
    cap_add: [NET_ADMIN]
    command: ["adaptive-web-world", '{"seed":"${SAMPLE_METADATA_SEED:-halvard-cve}","generator":"stub"}' ]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ca:/app/ca
      - sock:/run/fictionet/sock
      - store:/var/lib/adaptive-web
    healthcheck:
      test: ["CMD", "test", "-f", "/run/fictionet/ready"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  attach:
    build:
      <<: *build
      target: attach
    image: fictionet-adaptive-web-attach:dev
    command:
      - fictionet
      - attach
      - --world
      - unix:/run/fictionet/sock/world.sock
      - --name
      - agent
      - --type
      - tun
      - --ip-addr
      - 10.0.0.2/24
      - --gateway
      - 10.0.0.1
      - --dns
      - 10.0.0.1
      - --no-ip-addr-v6
      - --no-gateway-v6
      - --no-dns-v6
      - --ready-file
      - /run/attach-ready
    network_mode: none
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun
    volumes:
      - sock:/run/fictionet/sock
    depends_on:
      world:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/run/attach-ready"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  default:
    build:
      <<: *build
      target: agent
    image: fictionet-adaptive-web-agent:dev
    network_mode: "service:attach"
    volumes:
      - ca:/app/ca:ro
    depends_on:
      attach:
        condition: service_healthy
    init: true

volumes:
  ca:
  sock:
  store:
