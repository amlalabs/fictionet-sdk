[package]
name = "adaptive-web-world"
version = "0.0.0"
edition = "2024"
description = "The adaptive web on Fictionet: web::Sites for any name, with pages made on first request and kept."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
fictionet-observe = { path = "../../../observe", features = ["native"] }
example-common = { path = "../../common" }
bytes = "1"
fictionet = { path = "../../..", features = ["web-proxy"] }
http = "1"
http-body-util = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tower-service = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
