[package]
name = "adaptive-web-world"
version = "0.0.0"
edition = "2024"
description = "The adaptive web on Fictionet: web::Sites for any name, with pages made on first request and kept."
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, so its dependencies stay out of the
# fictionet crate's lock file.
[workspace]

[dependencies]
bytes = "1"
fictionet = { path = "../../..", features = ["web-proxy"] }
http = "1"
http-body-util = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tower-service = "0.3"

[profile.release]
debug = 1

[dev-dependencies]
fictionet = { path = "../../..", features = ["web-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
