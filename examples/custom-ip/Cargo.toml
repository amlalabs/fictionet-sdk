[package]
name = "fictionet-custom-ip"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
fictionet = { path = "../.." }

[dev-dependencies]
bytes = "1"
fictionet-extras = { path = "../../extras" }
fictionet-test-support = { path = "../../tests/support" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
