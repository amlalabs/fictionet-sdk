[package]
name = "scan-world"
version = "0.0.0"
edition = "2024"
description = "The Scan world on Fictionet: four simulated office machines and a real server on one subnet."
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "scan-world"
path = "src/main.rs"

[dependencies]
fictionet = { path = "../../.." }
http = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
