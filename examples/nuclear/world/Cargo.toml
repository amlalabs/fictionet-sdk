[package]
name = "nuclear-world"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "A deterministic educational two-loop pressurized water reactor world."

[lib]
path = "src/lib.rs"

[dependencies]
fictionet = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
http = "1"

[dev-dependencies]
# The page feature implies native, so one line serves the tests and the viewer.
fictionet-observe = { path = "../../../observe", features = ["page"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[[example]]
name = "viewer"
path = "examples/viewer.rs"
