[package]
name = "example-common"
version = "0.0.0"
edition = "2024"
description = "Code the example worlds share: the JSON Lines log, the projection of network events into it, enum names, the Docker worlds' command line, the quick-start world's sites, and hyper on simulated connections."
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "lib.rs"

[dependencies]
# No default features: the SDK's tests and the browser example use this
# crate too, and keep the SDK features they chose. The quick-start sites
# turn on with `std`.
fictionet = { path = "../..", default-features = false }
hyper = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

# The quick-start world listens on a host socket, which a browser has not.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = "1"
brotli = "8"
xz2 = "0.1"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
percent-encoding = "2"
quick-xml = { version = "0.38", features = ["escape-html"] }

fictionet-observe = { path = "../../observe", features = ["native"] }
axum = { version = "0.8", default-features = false }
http = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
fictionet = { path = "../..", features = ["std"], default-features = false }
ring = "0.17"
