[package]
name = "fakewiki-world"
version = "0.0.0"
edition = "2024"
description = "The FakeWiki world on Fictionet: web::Sites in front of FakeWiki's Python pages."
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, so its dependencies (rcgen and the rest) stay out of the
# fictionet crate's lock file.
[workspace]

[dependencies]
bytes = "1"
fictionet = { path = "../../..", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tower-service = "0.3"

[profile.release]
debug = 1

[dev-dependencies]
fictionet = { path = "../../..", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
