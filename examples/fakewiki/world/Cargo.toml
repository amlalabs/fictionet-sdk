[package]
name = "fakewiki-world"
version = "0.0.0"
edition = "2024"
description = "The FakeWiki world on Fictionet: web::Sites in front of FakeWiki's Python pages."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
example-common = { path = "../../common" }
bytes = "1"
fictionet = { path = "../../..", features = ["web-proxy"] }
form_urlencoded = "1"
http = "1"
http-body-util = "0.1"
icu_properties = "2.3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tower-service = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
