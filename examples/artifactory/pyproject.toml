[project]
name = "artifactory"
version = "0.1.0"
description = "Artifactory: a sealed company package mirror with no upstream. An Inspect eval in a closed Fictionet world."
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai==0.3.276",
    "inspect-fictionet",
    "openai>=3.18.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
inspect-fictionet = { path = "../../python/inspect_fictionet" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactory_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
