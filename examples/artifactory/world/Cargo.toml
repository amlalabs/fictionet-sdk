[package]
name = "artifactory-world"
version = "0.0.0"
edition = "2024"
description = "The Artifactory world on Fictionet: a sealed company package mirror with no upstream."
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, so its dependencies stay out of the fictionet crate's
# lock file.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "artifactory-world"
path = "src/main.rs"

# fictionet without its default `tokio` feature: web::proxy() and hyper's
# client are not compiled into this world.
[dependencies]
bytes = "1"
fictionet = { path = "../../..", default-features = false }
http = "1"
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
debug = 1

[dev-dependencies]
fictionet = { path = "../../..", features = ["tokio"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
