[package]
name = "web-world"
version = "0.0.0"
edition = "2024"
description = "The web on Fictionet: web::Sites for any name, with pages made on first request, by a model or offline, and kept."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
fictionet-extras = { path = "../../../extras" }
fictionet-host = { path = "../../../host" }
fictionet-observe = { path = "../../../observe", features = ["native"] }
example-common = { path = "../../common" }
bytes = "1"
fictionet = { path = "../../..", features = ["web-proxy"] }
http = "1"
http-body-util = "0.1"
form_urlencoded = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
url = "2"
tower-service = "0.3"
kuchiki = "0.8"
